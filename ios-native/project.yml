# XcodeGen spec for the native Loadwise app (SwiftUI). The Xcode project is
# generated from this file on the GitHub macOS runner (`xcodegen generate`),
# so nobody needs a Mac or a committed .xcodeproj.
name: Loadwise
options:
  bundleIdPrefix: eu.petrfitnessdata
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Loadwise:
    type: application
    platform: iOS
    sources:
      - path: Loadwise
    settings:
      base:
        # Its own bundle ID, so it installs next to the Capacitor app (mobile/).
        PRODUCT_BUNDLE_IDENTIFIER: eu.petrfitnessdata.loadwise.native
        PRODUCT_NAME: Loadwise
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: Loadwise/Info.plist
      properties:
        CFBundleDisplayName: Loadwise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Newsreader-Regular.ttf
          - Newsreader-Italic.ttf
  LoadwiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoadwiseTests
    dependencies:
      - target: Loadwise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: eu.petrfitnessdata.loadwise.native.tests
schemes:
  Loadwise:
    build:
      targets:
        Loadwise: all
        LoadwiseTests: [test]
    test:
      targets:
        - LoadwiseTests
