# XcodeGen spec for the native Loadwise app (SwiftUI). The Xcode project is
# generated from this file on the GitHub macOS runner (`xcodegen generate`),
# so nobody needs a Mac or a committed .xcodeproj.
name: Loadwise
options:
  bundleIdPrefix: eu.petrfitnessdata
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
  # Czech is the source language; en.lproj (Shared/) holds the English.
  developmentLanguage: cs
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Loadwise:
    type: application
    platform: iOS
    sources:
      - path: Loadwise
      - path: Shared
    dependencies:
      - target: LoadwiseWidgets
    # The App Group the home-screen widgets read Today from (WidgetBridge).
    entitlements:
      path: Loadwise/Loadwise.entitlements
      properties:
        com.apple.security.application-groups:
          - group.eu.petrfitnessdata.loadwise
    settings:
      base:
        # Its own bundle ID, so it installs next to the Capacitor app (mobile/).
        PRODUCT_BUNDLE_IDENTIFIER: eu.petrfitnessdata.loadwise.native
        PRODUCT_NAME: Loadwise
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ENABLE_PREVIEWS: YES
    info:
      path: Loadwise/Info.plist
      properties:
        CFBundleDisplayName: Loadwise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Loadwise čte čárové kódy na obalech potravin, aby je mohl zapsat do jídelníčku.
        NSPhotoLibraryUsageDescription: Loadwise načte fotku jídla nebo posilovny, kterou vybereš.
        # iOS 26 AlarmKit: the alarm from Nastavení → Spánek rings like the Clock's.
        NSAlarmKitUsageDescription: Loadwise tě vzbudí v čase budíku, podle kterého počítá večerku.
        # Built with the iOS 26 SDK for AlarmKit, the app keeps its own design.
        UIDesignRequiresCompatibility: true
        # loadwise://open/sleep: the widgets open a screen of the app.
        CFBundleURLTypes:
          - CFBundleURLName: eu.petrfitnessdata.loadwise.native
            CFBundleURLSchemes:
              - loadwise
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Newsreader-Regular.ttf
          - Newsreader-Italic.ttf
  # Home-screen and lock-screen widgets (WidgetKit), embedded in the app.
  LoadwiseWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: LoadwiseWidgets
      - path: Shared
    entitlements:
      path: LoadwiseWidgets/LoadwiseWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.eu.petrfitnessdata.loadwise
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: eu.petrfitnessdata.loadwise.native.widgets
        PRODUCT_NAME: LoadwiseWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: LoadwiseWidgets/Info.plist
      properties:
        CFBundleDisplayName: Loadwise
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  LoadwiseTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: LoadwiseTests
    dependencies:
      - target: Loadwise
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: eu.petrfitnessdata.loadwise.native.tests
schemes:
  Loadwise:
    build:
      targets:
        Loadwise: all
        LoadwiseTests: [test]
    test:
      targets:
        - LoadwiseTests
