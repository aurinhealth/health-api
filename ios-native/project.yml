# XcodeGen spec for the native Aurin app (SwiftUI). The Xcode project is
# generated from this file on the GitHub macOS runner (`xcodegen generate`),
# so nobody needs a Mac or a committed .xcodeproj.
name: Aurin
options:
  bundleIdPrefix: health.aurin
  deploymentTarget:
    # 17.4: the connect sheet sends its ticket in a header (Auth.swift), the
    # only way into /auth/app/connect (src/native-connect.js).
    iOS: "17.4"
  createIntermediateGroups: true
  # Czech is the source language; en.lproj (Shared/) holds the English.
  developmentLanguage: cs
settings:
  base:
    SWIFT_VERSION: "5.0"
    # Swift concurrency checks, as warnings in Swift 5 mode: every place two
    # threads could touch the same data. ios-native.yml counts them per file.
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
targets:
  Aurin:
    type: application
    platform: iOS
    sources:
      - path: Aurin
      - path: Shared
      # What the iPhone sends the Apple Watch app (App/WatchBridge.swift).
      - path: WatchShared
      # The privacy manifest App Store Connect checks (UserDefaults, file dates, the data sent to the server).
      - path: Privacy/App/PrivacyInfo.xcprivacy
        buildPhase: resources
      # The main icon in Icon Composer's Liquid Glass format, white in light
      # mode and dark in dark mode: iOS 26 draws the glass, clear and tinted
      # looks from its layers; older iOS uses AppIcon.appiconset of the same name.
      - path: Icon/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - target: AurinWidgets
      - target: AurinNotifications
      # The Apple Watch app, in the app's Watch folder ("Embed Watch Content").
      - target: AurinWatch
        embed: true
        copy:
          destination: productsDirectory
          subpath: $(CONTENTS_FOLDER_PATH)/Watch
    # The App Group the home-screen widgets read Today from (WidgetBridge).
    # HealthKit: Apple Health is read on the phone (App/AppleHealth.swift),
    # with background delivery so new nights and workouts sync on their own.
    entitlements:
      path: Aurin/Aurin.entitlements
      properties:
        # Sign in with Apple (LoginView); App Store rule 4.8 asks for it next to Google.
        com.apple.developer.applesignin:
          - Default
        com.apple.security.application-groups:
          - group.health.aurin
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        com.apple.developer.healthkit.background-delivery: true
        # Passkeys (Data/Passkeys.swift): the server must serve
        # /.well-known/apple-app-site-association with a webcredentials entry
        # for this app (src/apple-app-site-association.js, APPLE_TEAM_ID).
        # aurin.health is the server the app talks to (APIClient.server).
        # applinks: a shared workout's link (/t/<id>) opens the app.
        com.apple.developer.associated-domains:
          - webcredentials:aurin.health
          - applinks:aurin.health
        # Push notifications (App/PushRegistration.swift, src/push.js): the
        # morning readiness. One entitlements file serves every build, and
        # TestFlight and the App Store use APNs production; the App ID needs
        # the Push Notifications capability or the App Store export fails.
        aps-environment: production
    settings:
      base:
        # Aurin's own app (2026-11): Loadwise's eu.petrfitnessdata.loadwise.native was retired.
        PRODUCT_BUNDLE_IDENTIFIER: health.aurin.app
        PRODUCT_NAME: Aurin
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # The icons of Settings → Ikona aplikace (AppIcon-*.appiconset), for setAlternateIconName.
        ASSETCATALOG_COMPILER_INCLUDE_ALL_APPICON_ASSETS: YES
        ENABLE_PREVIEWS: YES
        # Aurin's App ID from developers.facebook.com: Sdílet → "Do příběhu na
        # Instagramu" (ShareExport.instagram) stays hidden while it is empty.
        META_APP_ID: "1387617773155698"
    info:
      path: Aurin/Info.plist
      properties:
        CFBundleDisplayName: Aurin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        ITSAppUsesNonExemptEncryption: false
        # The permission prompts in Czech, the development language; the phone's
        # language picks the text from Shared/{cs,en}.lproj/InfoPlist.strings.
        NSCameraUsageDescription: Aurin čte čárové kódy na obalech potravin, aby je mohl zapsat do jídelníčku, fotí pozadí obrázku ke sdílení a fotky, které pošleš kouči.
        NSPhotoLibraryUsageDescription: Aurin načte fotku jídla, posilovny, pro kouče nebo pozadí ke sdílení, kterou vybereš.
        NSLocationWhenInUseUsageDescription: Aurin vezme polohu jen když o to požádáš, aby ukázal počasí a kouč poradil trénink venku nebo uvnitř.
        NSHealthShareUsageDescription: Aurin čte z Apple Health spánek, tréninky, tep, HRV, teplotu zápěstí, kroky, váhu, jídlo a pití z jiných aplikací, pro deník všímavost, čas na denním světle, hluk ve spánku, příznaky a sexuální aktivitu a se zapnutým sledováním cyklu i menstruaci, ovulační testy a antikoncepci, aby spočítal regeneraci, zátěž a kalorický cíl a vyplnil deník.
        # Settings → Zdroje dat → Apple Health writes workouts, weight, food and water (App/AppleHealthExport.swift).
        NSHealthUpdateUsageDescription: Aurin do Apple Health zapíše jen to, co v aplikaci sám zaznamenáš a v Synchronizaci zapneš, například tréninky, váhu, jídlo a pití.
        # Nastavení → Snímač tepu: a Bluetooth chest strap or band for Režim tréninku (App/HeartRateSensor.swift).
        NSBluetoothAlwaysUsageDescription: Aurin se připojí ke snímači tepu, který si spáruješ, aby v režimu tréninku ukázal tep.
        # Kdy mám čas → Kalendář v iPhonu (App/CalendarTime.swift): only the free minutes per day reach the server.
        NSCalendarsFullAccessUsageDescription: Aurin podle událostí v kalendáři pozná, kolik máš ten den času na trénink, a když to zapneš, zapíše do něj naplánované tréninky. Události zůstávají v telefonu.
        NSCalendarsUsageDescription: Aurin podle událostí v kalendáři pozná, kolik máš ten den času na trénink, a když to zapneš, zapíše do něj naplánované tréninky. Události zůstávají v telefonu.
        # iOS 26 AlarmKit: the alarm from Nastavení → Spánek rings like the Clock's.
        NSAlarmKitUsageDescription: Aurin tě vzbudí v čase budíku, podle kterého počítá večerku.
        NSFaceIDUsageDescription: Aurin se zeptá na Face ID, než smaže tvůj účet.
        # Built with the iOS 26 SDK for AlarmKit, the app keeps its own design.
        UIDesignRequiresCompatibility: true
        # loadwise://open/sleep: the widgets open a screen of the app.
        CFBundleURLTypes:
          - CFBundleURLName: health.aurin.app
            CFBundleURLSchemes:
              - loadwise
        # Posilovna naživo and Režim tréninku on the lock screen and in the Dynamic Island (App/GymLiveActivity.swift).
        NSSupportsLiveActivities: true
        # Syncing without the app being opened (App/BackgroundRefresh.swift):
        # iOS runs the refresh task a few times a day when it chooses.
        # bluetooth-central: the paired heart rate strap (App/HeartRateSensor.swift)
        # keeps sending beats while the phone is locked during Režim tréninku.
        UIBackgroundModes:
          - fetch
          - bluetooth-central
          # The rest's countdown and end tones with the phone locked (GymSignals.planRest).
          - audio
        BGTaskSchedulerPermittedIdentifiers:
          - health.aurin.app.refresh
        # Sdílet → Instagram Stories (ShareExport.instagram) with the Meta app ID.
        LSApplicationQueriesSchemes:
          - instagram-stories
        MetaAppID: $(META_APP_ID)
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - InstrumentSerif-Italic.ttf
          - Newsreader-Regular.ttf
          - Newsreader-Italic.ttf
  # Home-screen and lock-screen widgets (WidgetKit), embedded in the app.
  AurinWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: AurinWidgets
      - path: Shared
        # Siri phrases belong to the app's AurinShortcuts only.
        excludes:
          - "en.lproj/AppShortcuts.strings"
      - path: Privacy/Widgets/PrivacyInfo.xcprivacy
        buildPhase: resources
    entitlements:
      path: AurinWidgets/AurinWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.health.aurin
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: health.aurin.app.widgets
        PRODUCT_NAME: AurinWidgets
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: AurinWidgets/Info.plist
      properties:
        CFBundleDisplayName: Aurin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  # The morning readiness push gets its coloured ring before iOS shows it
  # (NotificationService.swift, src/push.js readinessMessage), embedded in the app.
  AurinNotifications:
    type: app-extension
    platform: iOS
    sources:
      - path: AurinNotifications
      - path: Aurin/Resources/Fonts/InstrumentSerif-Regular.ttf
        buildPhase: resources
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: health.aurin.app.notifications
        PRODUCT_NAME: AurinNotifications
        TARGETED_DEVICE_FAMILY: "1"
        SKIP_INSTALL: YES
    info:
      path: AurinNotifications/Info.plist
      properties:
        CFBundleDisplayName: Aurin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.usernotifications.service
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).NotificationService
  # The Apple Watch app (AurinWatch/): Today from the iPhone over
  # WatchConnectivity (WatchStore), embedded in the app and installed with it.
  AurinWatch:
    type: application
    platform: watchOS
    # 10: the vertical pages of a detail and their coloured backgrounds.
    deploymentTarget: "10.0"
    sources:
      - path: AurinWatch
      - path: WatchShared
      - path: Aurin/Resources/Fonts/InstrumentSerif-Regular.ttf
        buildPhase: resources
      - path: Aurin/Resources/Fonts/Newsreader-Regular.ttf
        buildPhase: resources
      - path: AurinWatchWidgets/ComplicationShelf.swift
    # The complications on the watch face, in the watch app's PlugIns.
    dependencies:
      - target: AurinWatchWidgets
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: health.aurin.app.watchkitapp
        PRODUCT_NAME: AurinWatch
        TARGETED_DEVICE_FAMILY: "4"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SKIP_INSTALL: YES
    # HealthKit: the gym runs as a strength workout on the watch (GymWorkout.swift),
    # with the heart rate and calories, saved to Apple Health at the end.
    entitlements:
      path: AurinWatch/AurinWatch.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
        # Today for the complications (ComplicationShelf) and the sign-in
        # (WatchAPI) in one Keychain group with AurinWatchWidgets: no App
        # Group to register. The team comes in from the environment at
        # xcodegen (APPLE_TEAM_ID), as the archive is signed ad hoc first.
        keychain-access-groups:
          - ${APPLE_TEAM_ID}.health.aurin.watch
    info:
      path: AurinWatch/Info.plist
      properties:
        CFBundleDisplayName: Aurin
        NSHealthShareUsageDescription: Aurin na hodinkách čte tep a spálené kalorie během tréninku v posilovně.
        NSHealthUpdateUsageDescription: Aurin uloží trénink z posilovny na hodinkách do Apple Health, s tepem a kaloriemi.
        # The workout keeps the gym on the screen between sets; the smart
        # alarm session wakes the user on the watch (WatchAlarm.swift).
        WKBackgroundModes:
          - workout-processing
          - alarm
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        WKApplication: true
        WKCompanionAppBundleIdentifier: health.aurin.app
        UIAppFonts:
          - InstrumentSerif-Regular.ttf
          - Newsreader-Regular.ttf
  # The watch face's complications (AurinWatchWidgets/): the last Today the
  # watch app got, read from the Keychain group they share.
  AurinWatchWidgets:
    type: app-extension
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: AurinWatchWidgets
      - path: WatchShared/WatchSnapshot.swift
    entitlements:
      path: AurinWatchWidgets/AurinWatchWidgets.entitlements
      properties:
        keychain-access-groups:
          - ${APPLE_TEAM_ID}.health.aurin.watch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: health.aurin.app.watchkitapp.widgets
        PRODUCT_NAME: AurinWatchWidgets
        TARGETED_DEVICE_FAMILY: "4"
        SKIP_INSTALL: YES
    info:
      path: AurinWatchWidgets/Info.plist
      properties:
        CFBundleDisplayName: Aurin
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
  AurinTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: AurinTests
    dependencies:
      - target: Aurin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: health.aurin.app.tests
  # The smoke test before a release: the app tapped through on the simulator (ios-native.yml).
  AurinUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: AurinUITests
    dependencies:
      - target: Aurin
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: health.aurin.app.uitests
        TEST_TARGET_NAME: Aurin
schemes:
  Aurin:
    build:
      targets:
        Aurin: all
        AurinTests: [test]
    test:
      targets:
        - AurinTests
      # The tests check the Czech source texts; the simulator itself speaks English.
      language: cs
  # Its own scheme, so the unit tests and screen renders run as before.
  AurinSmoke:
    build:
      targets:
        Aurin: all
        AurinUITests: [test]
    test:
      targets:
        - AurinUITests
      language: cs
