name: Health & Strength tests

on:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/health-strength-tests.yml"
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - ".github/workflows/health-strength-tests.yml"

permissions:
  contents: read

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run strength regression tests
        run: node --test tests/strength-regressions.test.mjs
