name: Health & Strength tests

# Pull requests only: on main the same checks run as the first job of
# deploy-worker.yml, before anything is deployed.
on:
  pull_request:
    paths:
      - "src/**"
      - "tests/**"
      - "package.json"
      - "eslint.config.mjs"
      - ".github/workflows/health-strength-tests.yml"

permissions:
  contents: read

# A newer push to the same pull request cancels the older run: only the newest
# commit's result matters.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out the private AI prompts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: shaarkyn/aurin-prompts
          token: ${{ secrets.PROMPTS_REPO_TOKEN }}
          path: src/private

      # The tenancy tests use node:sqlite, available from Node 22.
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Check syntax
        run: npm run check

      - name: Lint (undefined variables)
        run: npm run lint:install && npm run lint

      - name: Run tests
        run: npm test
