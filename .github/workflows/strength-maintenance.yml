name: Strength sheet maintenance
# Periodic Intervals and nutrition sync. The strength plan lives in D1, so
# there is no Google Sheet to maintain any more.

on:
  workflow_dispatch:
  # Only main: the Worker accepts GitHub OIDC tokens from main only, so a run
  # on another branch can never authenticate.
  push:
    branches: [main]
    paths:
      - ".github/workflows/strength-maintenance.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  id-token: write
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=""
          for attempt in 1 2 3; do
            if response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"; then
              break
            fi
            sleep $((attempt * 10))
          done
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Sync Intervals
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            response="$(curl -sS -w '\n%{http_code}' -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/sync/intervals" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              printf '%s\n' "$body"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              printf '%s\n' "$body"
              exit 1
            fi
            sleep $((attempt * 20))
          done


      - name: Sync planned workout calorie estimates
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data '{}' "https://petrfitnessdata.eu/automation/planned-calories" || true)"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { printf '%s\n' "$body"; exit 1; }
          printf '%s\n' "$body"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d' <<< "$body"

      - name: Sync daily nutrition notes
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data '{}' "https://petrfitnessdata.eu/automation/nutrition-notes" || true)"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            printf '%s\n' "$body"
            python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d' <<< "$body"
          else
            printf '%s\n' "$body"
            exit 1
          fi

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS "https://petrfitnessdata.eu/mcp/health")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok"; assert d.get("service") == "health-api-mcp"' <<< "$health"
