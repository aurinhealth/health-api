name: Periodic sync
# Periodic Intervals and nutrition sync.

on:
  workflow_dispatch:
  # Only main: the Worker accepts GitHub OIDC tokens from main only, so a run
  # on another branch can never authenticate.
  push:
    branches: [main]
    paths:
      - ".github/workflows/strength-maintenance.yml"
  schedule:
    - cron: "*/15 * * * *"

permissions:
  id-token: write
  contents: read

jobs:
  maintenance:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      # The repository and its Actions logs are public, so the steps below print
      # only a summary (status and counts) of each response, never the body.
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          sparse-checkout: scripts
          sparse-checkout-cone-mode: true

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response=""
          for attempt in 1 2 3; do
            if response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"; then
              break
            fi
            sleep $((attempt * 10))
          done
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Sync Intervals
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2 3; do
            response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data '{}' "https://petrfitnessdata.eu/sync/intervals" || true)"
            code="${response##*$'\n'}"
            body="${response%$'\n'*}"
            if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
              node scripts/ci-summary.mjs <<< "$body"
              break
            fi
            if [ "$attempt" -eq 3 ]; then
              echo "HTTP $code"
              node scripts/ci-summary.mjs <<< "$body"
              exit 1
            fi
            sleep $((attempt * 20))
          done


      # Calorie estimates are no longer written to Intervals.icu; this removes
      # the lines left in planned workouts from today on (60 days).
      - name: Remove planned workout calorie estimates
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data '{}' "https://petrfitnessdata.eu/automation/planned-calories" || true)"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          node scripts/ci-summary.mjs <<< "$body"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "HTTP $code"; exit 1; }
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok","status="+str(d.get("status"))' <<< "$body"

      # The daily "Nutrition — date" notes are no longer written to Intervals.icu;
      # this removes any that are left from today on.
      - name: Remove daily nutrition notes
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="{\"action\":\"delete\",\"oldest\":\"$(TZ=Europe/Prague date +%F)\",\"newest\":\"$(TZ=Europe/Prague date -d '+60 days' +%F)\"}"
          response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data "$body" "https://petrfitnessdata.eu/automation/nutrition-notes" || true)"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          node scripts/ci-summary.mjs <<< "$body"
          if [ "$code" -ge 200 ] && [ "$code" -lt 300 ]; then
            python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok","status="+str(d.get("status"))' <<< "$body"
          else
            echo "HTTP $code"
            exit 1
          fi

      - name: Verify Worker health
        shell: bash
        run: |
          set -euo pipefail
          health="$(curl -fsS "https://petrfitnessdata.eu/mcp/health")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok"; assert d.get("service") == "health-api-mcp"' <<< "$health"
