name: iOS app

# Builds the iPhone app in mobile/ (a Capacitor shell around
# https://petrfitnessdata.eu/app) without an Apple Developer account:
# - Loadwise-unsigned.ipa: install with Sideloadly or AltStore, which sign it
#   with a free Apple ID (valid for 7 days, then install again).
# - Loadwise-simulator.zip: the app for the iOS Simulator (Xcode, Appetize.io).
# The app loads the live web app, so web changes need no new build; only
# changes in mobile/ do. Artifacts are under Actions → this run → Artifacts.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "mobile/**"
      - ".github/workflows/ios-app.yml"
  pull_request:
    paths:
      - "mobile/**"
      - ".github/workflows/ios-app.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30
    defaults:
      run:
        working-directory: mobile
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Capacitor
        run: npm ci --no-audit --no-fund

      # Copies www/ and capacitor.config.json into the Xcode project.
      - name: Sync the Xcode project
        run: npx cap sync ios

      - name: Build for the iOS Simulator
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Debug \
            -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          (cd build/Build/Products/Debug-iphonesimulator && zip -qry "$GITHUB_WORKSPACE/Loadwise-simulator.zip" App.app)

      # Unsigned: Sideloadly or AltStore sign it with the user's Apple ID.
      - name: Build for iPhone
        run: |
          xcodebuild -project ios/App/App.xcodeproj -scheme App -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' \
            -derivedDataPath build CODE_SIGNING_ALLOWED=NO build
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/App.app ipa/Payload/
          (cd ipa && zip -qry "$GITHUB_WORKSPACE/Loadwise-unsigned.ipa" Payload)

      - name: Upload the app
        uses: actions/upload-artifact@v4
        with:
          name: Loadwise-ios
          path: |
            Loadwise-unsigned.ipa
            Loadwise-simulator.zip
          retention-days: 30
