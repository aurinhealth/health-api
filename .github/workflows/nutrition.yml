name: Nutrition automation

on:
  push:
    branches:
      - main
    paths:
      - "automation/nutrition-request.json"

# Read only: the plan is not committed back. The repository and its Actions
# logs are public, so the run prints only a summary of the response; the plan
# itself is in the app, or through MCP (getNutritionPlan).
permissions:
  id-token: write
  contents: read

jobs:
  nutrition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Generate nutrition plan
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          result="$RUNNER_TEMP/nutrition-result.json"
          http_code="$(curl -sS -o "$result" -w "%{http_code}" -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data @automation/nutrition-request.json "https://petrfitnessdata.eu/automation/nutrition")"
          echo "HTTP $http_code"
          node scripts/ci-summary.mjs < "$result"
          [ "$http_code" -ge 200 ] && [ "$http_code" -lt 300 ]
