name: Nutrition automation

on:
  push:
    branches:
      - main
    paths:
      - "automation/nutrition-request.json"

permissions:
  id-token: write
  contents: write

jobs:
  nutrition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Request GitHub OIDC token
        id: oidc
        continue-on-error: true
        shell: bash
        run: |
          set +e
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"
          rc=$?
          if [ "$rc" -ne 0 ]; then echo "token=" >> "$GITHUB_OUTPUT"; echo "oidc_failed=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
          echo "oidc_failed=false" >> "$GITHUB_OUTPUT"
      - name: Generate nutrition plan
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          OIDC_FAILED: ${{ steps.oidc.outputs.oidc_failed }}
        run: |
          set -uo pipefail
          if [ "$OIDC_FAILED" = "true" ] || [ -z "$OIDC_TOKEN" ]; then
            printf '%s\n' '{"status":"error","step":"oidc_token","message":"GitHub OIDC token request failed"}' > automation/nutrition-result.json
            exit 1
          fi
          body="$(cat automation/nutrition-request.json)"
          http_code="$(curl -sS -o automation/nutrition-result.json -w "%{http_code}" -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "$body"             "https://health-api.chelseafc-czsk.workers.dev/automation/nutrition")"
          echo "HTTP $http_code"
          cat automation/nutrition-result.json
          printf '%s' "$http_code" > automation/nutrition-http-status.txt
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
      - name: Report nutrition result
        if: always()
        run: |
          set -euo pipefail
          if [ -f automation/nutrition-result.json ]; then cat automation/nutrition-result.json; else echo "No nutrition result file was produced"; fi
      - name: Persist nutrition result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/nutrition-result.json
          git diff --cached --quiet && exit 0
          git commit -m "Store nutrition plan result"
          git push
