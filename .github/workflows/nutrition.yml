name: Nutrition automation

on:
  push:
    branches:
      - main
    paths:
      - "automation/nutrition-request.json"
  issues:
    types: [opened]
  pull_request:
    types: [opened, synchronize]

permissions:
  id-token: write
  contents: write
  issues: write

jobs:
  nutrition:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"
      - name: Generate nutrition plan
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -uo pipefail
          if [ "${{ github.event_name }}" = "issues" ]; then
            body='{"request_id":"issue-nutrition-verification","date":"2026-09-21"}'
          else
            body="$(cat automation/nutrition-request.json)"
          fi
          http_code="$(curl -sS -o automation/nutrition-result.json -w "%{http_code}" -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "$body"             "https://health-api.chelseafc-czsk.workers.dev/automation/nutrition")"
          echo "HTTP $http_code"
          cat automation/nutrition-result.json
          printf '%s' "$http_code" > automation/nutrition-http-status.txt
          if [ "$http_code" -lt 200 ] || [ "$http_code" -ge 300 ]; then
            exit 1
          fi
      - name: Report nutrition result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [ -f automation/nutrition-result.json ]; then
            result="$(cat automation/nutrition-result.json)"
          else
            result='{"status":"error","message":"No nutrition result file was produced"}'
          fi
          if [ "${{ github.event_name }}" = "issues" ]; then
            gh issue comment "${{ github.event.issue.number }}" --body "Nutrition verification result:
```json
${result}
```"
          fi
      - name: Persist nutrition result
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add automation/nutrition-result.json
          git diff --cached --quiet && exit 0
          git commit -m "Store nutrition plan result"
          git push
