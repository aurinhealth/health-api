name: Health & Strength automation

on:
  push:
    branches:
      - main
    paths:
      - "automation/strength-request.json"
  schedule:
    - cron: "5 1 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  strength:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Read automation request
        id: request
        shell: bash
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "schedule" ]; then
            date_value="$(TZ=Europe/Prague date +%F)"
            preview_value="false"
          else
            action_value="$(python - <<'PY'
          import json
          with open("automation/strength-request.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          print(data.get("action", "generate"))
          PY
          )"
            if [ "$action_value" = "none" ]; then
              echo "skip=true" >> "$GITHUB_OUTPUT"
              echo "date=" >> "$GITHUB_OUTPUT"
              echo "preview=true" >> "$GITHUB_OUTPUT"
              echo "Neutral strength automation request; nothing to run."
              exit 0
            fi
            date_value="$(python - <<'PY'
          import json
          with open("automation/strength-request.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          print(data.get("date", ""))
          PY
          )"
            preview_value="$(python - <<'PY'
          import json
          with open("automation/strength-request.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          print("true" if data.get("preview") is True else "false")
          PY
          )"
          fi
          echo "date=$date_value" >> "$GITHUB_OUTPUT"
          echo "preview=$preview_value" >> "$GITHUB_OUTPUT"
          echo "skip=false" >> "$GITHUB_OUTPUT"

      - name: Request GitHub OIDC token
        if: steps.request.outputs.skip != 'true'
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?ACTIONS_ID_TOKEN_REQUEST_URL is not available}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?ACTIONS_ID_TOKEN_REQUEST_TOKEN is not available}"
          response="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Sync daily nutrition notes
        if: steps.request.outputs.skip != 'true'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data '{"oldest":"'"$(TZ=Europe/Prague date +%F)"'","newest":"'"$(TZ=Europe/Prague date -d "+1 day" +%F)"'"}' "https://health-api.chelseafc-czsk.workers.dev/automation/nutrition-notes" || true)"
          code="${response##*$'\n'}"; body="${response%$'\n'*}"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { printf '%s\n' "$body"; exit 1; }
          printf '%s\n' "$body"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d' <<< "$body"

      - name: Generate and write strength plan
        if: steps.request.outputs.skip != 'true'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
          REQUEST_DATE: ${{ steps.request.outputs.date }}
          REQUEST_PREVIEW: ${{ steps.request.outputs.preview }}
        run: |
          set -euo pipefail
          body="$(python - <<'PY'
          import json, os
          with open("automation/strength-request.json", "r", encoding="utf-8") as f:
              data = json.load(f)
          data["date"] = os.environ.get("REQUEST_DATE", "") or None
          data["preview"] = os.environ.get("REQUEST_PREVIEW", "false").lower() == "true"
          print(json.dumps(data))
          PY
          )"
          curl -fsS \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data "$body" \
            "https://health-api.chelseafc-czsk.workers.dev/automation/strength"

      - name: Sync planned workout calorie estimates
        if: steps.request.outputs.skip != 'true' && steps.request.outputs.preview != 'true'
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          response="$(curl -fsS \
            -X POST \
            -H "Authorization: Bearer $OIDC_TOKEN" \
            -H "Content-Type: application/json" \
            --data '{"oldest":"'"$(TZ=Europe/Prague date +%F)"'","newest":"'"$(TZ=Europe/Prague date -d "+14 days" +%F)"'"}' \
            "https://health-api.chelseafc-czsk.workers.dev/automation/planned-calories")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok", d' <<< "$response"
          echo "$response"
