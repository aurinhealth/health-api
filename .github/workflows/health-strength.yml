name: Nightly gym plan

# Makes the day's gym plan at night, only on a gym day of the week plan and
# never over a plan that is already there.
on:
  schedule:
    - cron: "5 1 * * *"

permissions:
  id-token: write
  contents: read

jobs:
  strength:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Request GitHub OIDC token
        id: oidc
        shell: bash
        run: |
          set -euo pipefail
          : "${ACTIONS_ID_TOKEN_REQUEST_URL:?ACTIONS_ID_TOKEN_REQUEST_URL is not available}"
          : "${ACTIONS_ID_TOKEN_REQUEST_TOKEN:?ACTIONS_ID_TOKEN_REQUEST_TOKEN is not available}"
          response="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Generate the gym plan
        env:
          OIDC_TOKEN: ${{ steps.oidc.outputs.token }}
        run: |
          set -euo pipefail
          body="{\"date\":\"$(TZ=Europe/Prague date +%F)\"}"
          response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data "$body" "https://petrfitnessdata.eu/automation/strength")"
          code="${response##*$'\n'}"
          # Public log: a summary only, never the plan itself.
          node scripts/ci-summary.mjs <<< "${response%$'\n'*}"
          [ "$code" -ge 200 ] && [ "$code" -lt 300 ] || { echo "HTTP $code"; exit 1; }
