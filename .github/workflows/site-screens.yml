name: Website screens

# Takes the app's screens for the website again: the Aurin-screens artifact of the newest
# successful "iOS native app" run on main, turned into public/site/app/*.webp by
# scripts/site-screens.mjs, committed to the branch it runs on when anything changed.
# Run it on a pull request's branch (Actions → Website screens → Run workflow → the branch).
on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/site-screens.yml"

permissions:
  contents: write
  actions: read

jobs:
  screens:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.ref != 'refs/heads/main'
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Download the newest screens from main
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-native.yml --branch main --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          [ -n "$run_id" ] || { echo "No successful iOS run on main"; exit 1; }
          gh run download "$run_id" --repo "$GITHUB_REPOSITORY" --name Aurin-screens --dir "$RUNNER_TEMP/screens"
          echo "Screens from https://github.com/$GITHUB_REPOSITORY/actions/runs/$run_id" >> "$GITHUB_STEP_SUMMARY"
          echo "RUN_ID=$run_id" >> "$GITHUB_ENV"

      - name: Turn them into the website's screens
        run: |
          command -v magick >/dev/null || command -v convert >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq imagemagick; }
          node scripts/site-screens.mjs "$RUNNER_TEMP/screens" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Commit what changed
        run: |
          if git diff --quiet -- public/site/app; then
            echo "The website's screens are up to date." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/site/app
          git commit -m "Website: the app's screens again, from iOS run $RUN_ID"
          git push
          git diff --stat HEAD~1 -- public/site/app >> "$GITHUB_STEP_SUMMARY"
