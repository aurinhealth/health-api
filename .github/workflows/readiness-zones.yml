name: Readiness zones on staging

# How many days are green, yellow or red on the test server's accounts
# (audit 2026-11-06, O5). Read only; the job summary shows counts per
# account under a number, no ids and no health values. Started by hand.
on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days back (at most 90)"
        required: false
        default: "60"

permissions:
  contents: read

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: staging
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Check out the private AI prompts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: aurinhealth/aurin-prompts
          token: ${{ secrets.PROMPTS_REPO_TOKEN }}
          path: src/private
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Count the zones
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          READINESS_DAYS: ${{ inputs.days }}
        run: node scripts/readiness-zones.mjs
