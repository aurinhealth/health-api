# Temporary: the tabs drawn at the iPhone Duo's widths (SnapshotTests.testDuoWidths)
# for the Duo layout mockups. Runs only that test.
name: Duo probe
on:
  push:
    branches:
      - claude/project-thread-6xtv9j
    paths:
      - ".github/workflows/duo-probe.yml"
      - "ios-native/**"
permissions:
  contents: read
concurrency:
  group: duo-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 45
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version
      - name: Muscle model
        env:
          MUSCLE_MODEL_R2_KEY_ID: ${{ secrets.MUSCLE_MODEL_R2_KEY_ID }}
          MUSCLE_MODEL_R2_SECRET: ${{ secrets.MUSCLE_MODEL_R2_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../.github/scripts/fetch-muscle-model.sh
      - name: Project
        env:
          APPLE_TEAM_ID: SIMULATOR
        run: brew install xcodegen && xcodegen generate
      - name: Render
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/duo
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          d = json.load(sys.stdin)["devices"]
          print(next(x["udid"] for r in ["com.apple.CoreSimulator.SimRuntime.iOS-27-0"] for x in d.get(r, []) if x["name"] == "iPhone 17 Pro"))')
          mkdir -p "$TEST_RUNNER_SNAPSHOT_DIR"
          set -o pipefail
          xcodebuild -project Aurin.xcodeproj -scheme Aurin -configuration Debug -destination "id=$udid" -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO -only-testing:AurinTests/SnapshotTests/testDuoWidths test 2>&1 \
            | grep -E "error:|warning: .*(WideLayout|WidgetBoard|TodayView|RootView)|Test Case|Executed|\*\*" || true
          ls "$TEST_RUNNER_SNAPSHOT_DIR" | head -80
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: duo-probe
          path: duo
          if-no-files-found: ignore
          retention-days: 7
