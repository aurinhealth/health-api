name: TEMPORARY Duo Training probe

# To be removed with the fix: why Training is empty on the iPhone Duo.
# Builds the simulator app only, opens Training on the Duo (open and closed)
# with the Probe launch arguments and keeps the console and the screenshots.
on:
  push:
    branches:
      - claude/project-thread-o3qudc
    paths:
      - "ios-native/**"
      - ".github/workflows/duo-probe.yml"

permissions:
  contents: read

jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 50
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Pick Xcode
        run: |
          xcode=$(for x in /Applications/Xcode_*.app; do [ -d "$x" ] && echo "$(cd "$x" && pwd -P)"; done | sort -u | grep -vi -e beta -e release_candidate -e _rc | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode/Contents/Developer"; fi
          xcodebuild -version

      - name: Generate the Xcode project
        env:
          APPLE_TEAM_ID: SIMULATOR
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build for the simulator
        run: |
          set -o pipefail
          xcodebuild -project Aurin.xcodeproj -scheme Aurin -configuration Debug \
            -destination 'generic/platform=iOS Simulator' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build 2>&1 | tail -40

      - name: Probe Training on the Duo
        continue-on-error: true
        timeout-minutes: 20
        run: |
          xcrun simctl shutdown all || true
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          version = lambda runtime: [int(n) for n in runtime.split("iOS-")[-1].split("-")]
          runtimes = sorted((r for r in devices if "iOS" in r), key=version, reverse=True)
          duo = [d for r in runtimes for d in devices[r] if "Duo" in d["name"]]
          print(duo[0]["udid"] if duo else "")')
          if [ -z "$udid" ]; then
            type=$(xcrun simctl list devicetypes | grep -i "iPhone Duo" | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
            runtime=$(xcrun simctl list runtimes | grep -E "^iOS" | tail -1 | sed -E 's/.* - (com\.apple[^ ]*).*/\1/')
            udid=$(xcrun simctl create "iPhone Duo" "$type" "$runtime")
          fi
          dir="$GITHUB_WORKSPACE/probe"
          mkdir -p "$dir"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/Aurin.app
          clang -fobjc-arc -framework Foundation -o "$RUNNER_TEMP/duo-hinge" "$GITHUB_WORKSPACE/.github/scripts/duo-hinge.m"
          hinge() { DEVELOPER_DIR="$(xcode-select -p)" "$RUNNER_TEMP/duo-hinge" -d "$udid" "$1"; sleep 3; }
          # Warm-up: the first screenshot after boot is slow.
          xcrun simctl launch "$udid" health.aurin.app -demo || true
          sleep 7
          xcrun simctl io "$udid" screenshot --display=1 "$RUNNER_TEMP/warmup.png" || true
          shot() {
            local name=$1; shift
            xcrun simctl launch --console-pty --terminate-running-process "$udid" health.aurin.app \
              -demo -tab "${TAB:-training}" -AppleLanguages "(en)" -AppleLocale en_US -language en -probe 1 "$@" > "$dir/$name.log" 2>&1 &
            local pid=$!
            sleep 10
            for d in 1 3; do xcrun simctl io "$udid" screenshot --display=$d "$dir/$name-display$d.png" || true; done
            kill "$pid" 2>/dev/null || true
            echo "== $name"; grep -a PROBE "$dir/$name.log" | sort | uniq -c | sort -rn | head -30
          }
          hinge flat
          shot open-base
          shot open-nostrip -probeNoStripScroll 1
          shot open-noown -probeNoOwnWidth 1
          shot open-both -probeNoStripScroll 1 -probeNoOwnWidth 1
          TAB=food shot open-food
          hinge closed
          shot closed-base
          shot closed-nostrip -probeNoStripScroll 1
          shot closed-noown -probeNoOwnWidth 1
          xcrun simctl shutdown "$udid" || true

      - name: Upload the probe
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: duo-probe
          path: probe
          if-no-files-found: ignore
          retention-days: 3
