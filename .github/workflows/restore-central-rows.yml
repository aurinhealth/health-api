name: Restore central rows

# One-off repair (scripts/restore-central-rows.mjs): copies the consents,
# connections, push tokens and other central rows that the account move before
# #599 put on user databases back to the central database, then deletes the
# shard copies. Run without "apply" first for the counts. Production asks for
# the same approval as a deploy.
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Server"
        type: choice
        options: [staging, production]
        default: staging
      apply:
        description: "Restore (off: only count)"
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  restore:
    runs-on: ubuntu-latest
    # A few hundred rows at most.
    timeout-minutes: 30
    environment: ${{ inputs.target == 'production' && 'production' || 'staging' }}
    # Never alongside a deploy or the backup of the same server.
    concurrency:
      group: ${{ inputs.target == 'production' && 'production-deploy' || 'staging-deploy' }}
      cancel-in-progress: false
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out the private AI prompts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: shaarkyn/aurin-prompts
          token: ${{ secrets.PROMPTS_REPO_TOKEN }}
          path: src/private

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Restore central rows
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          TARGET: ${{ inputs.target }}
          APPLY: ${{ inputs.apply }}
        run: |
          args=()
          [ "$TARGET" = staging ] && args+=(--staging)
          [ "$APPLY" = true ] && args+=(--apply)
          node scripts/restore-central-rows.mjs "${args[@]}"
