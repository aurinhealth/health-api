# Temporary: are the blank iPhone screenshots of opened pages (strain, muscles)
# from this PR's Components.swift? Builds the app with it (A) and with main's
# (B), opens each page several times on an ordinary iPhone and screenshots it
# after 7 and after 20 seconds. Removed before merge.
name: Blank page probe
on:
  push:
    branches:
      - claude/project-thread-6xtv9j
    paths:
      - ".github/workflows/blank-probe.yml"
permissions:
  contents: read
concurrency:
  group: blank-probe
  cancel-in-progress: true
jobs:
  probe:
    runs-on: xcode-27
    timeout-minutes: 75
    defaults:
      run:
        working-directory: ios-native
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
      - name: Xcode
        run: sudo xcode-select -s /Applications/Xcode_27.1.app/Contents/Developer && xcodebuild -version
      - name: Muscle model
        env:
          MUSCLE_MODEL_R2_KEY_ID: ${{ secrets.MUSCLE_MODEL_R2_KEY_ID }}
          MUSCLE_MODEL_R2_SECRET: ${{ secrets.MUSCLE_MODEL_R2_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../.github/scripts/fetch-muscle-model.sh
      - name: Project
        env:
          APPLE_TEAM_ID: SIMULATOR
        run: brew install xcodegen && xcodegen generate
      - name: Build A (this PR) and B (main's Components.swift)
        run: |
          set -o pipefail
          b() {
            xcodebuild -project Aurin.xcodeproj -scheme Aurin -configuration Debug \
              -destination "generic/platform=iOS Simulator" -derivedDataPath build \
              CODE_SIGNING_ALLOWED=NO build 2>&1 | grep -E "error:|\*\*" || true
          }
          b; cp -R build/Build/Products/Debug-iphonesimulator/Aurin.app "$RUNNER_TEMP/A.app"
          git show origin/main:ios-native/Aurin/Design/Components.swift > Aurin/Design/Components.swift
          b; cp -R build/Build/Products/Debug-iphonesimulator/Aurin.app "$RUNNER_TEMP/B.app"
          ls "$RUNNER_TEMP"
      - name: Shoot
        timeout-minutes: 45
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          version = lambda runtime: [int(n) for n in runtime.split("iOS-")[-1].split("-")]
          runtimes = sorted((r for r in devices if "iOS" in r), key=version, reverse=True)
          ordinary = lambda r: [d for d in devices[r] if d["name"].startswith("iPhone") and "Duo" not in d["name"]]
          runtime = next(r for r in runtimes if ordinary(r))
          first = ordinary(runtime)
          names = ("iPhone 17", "iPhone 17 Pro", "iPhone 18 Pro", "iPhone 16", "iPhone 16 Pro")
          pick = next((d for n in names for d in first if d["name"] == n), first[0])
          print(pick["name"], runtime, file=sys.stderr)
          print(pick["udid"])')
          out="$GITHUB_WORKSPACE/probe"; mkdir -p "$out"
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl ui "$udid" appearance light
          xcrun simctl status_bar "$udid" override --time "9:41" || true
          for round in 1 2 3; do
            for v in A B; do
              xcrun simctl install "$udid" "$RUNNER_TEMP/$v.app"
              xcrun simctl launch "$udid" health.aurin.app -demo; sleep 8
              for route in readiness strain muscles gym/2026-10-08; do
                name="$v-$round-${route%%/*}"
                xcrun simctl launch --terminate-running-process "$udid" health.aurin.app -demo -open "$route" -AppleLanguages "(en)" -AppleLocale en_US -language en
                sleep 7
                xcrun simctl io "$udid" screenshot "$out/$name-7s.png" 2>/dev/null
                sleep 13
                xcrun simctl io "$udid" screenshot "$out/$name-20s.png" 2>/dev/null
                ls -l "$out/$name-7s.png" "$out/$name-20s.png" | awk '{print $5, $9}'
              done
            done
          done
          xcrun simctl shutdown "$udid" || true
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        if: always()
        with:
          name: blank-probe
          path: probe
          if-no-files-found: ignore
          retention-days: 7
