name: iOS native app

# Builds the native SwiftUI app in ios-native/ without a Mac or an Apple
# Developer account. The Xcode project is generated from project.yml.
# Artifacts (Actions → this run → Artifacts):
# - Aurin-unsigned.ipa: install with Sideloadly (free Apple ID,
#   valid for 7 days, then install again). It sits next to the Capacitor app.
#   Without the licensed 3D muscle figure, which only the simulator build and
#   TestFlight carry (.github/scripts/fetch-muscle-model.sh).
#   Built on main and by hand only: on a pull request the Release build took
#   about 12 of the run's 28 minutes, and after the merge the TestFlight
#   archive (ios-testflight.yml) builds Release again anyway.
# - Aurin-screens: whole-screen snapshots in light and dark mode
#   from the sample data, plus simulator screenshots of the running app
#   (site/: the English, light-mode shots the website uses; smoke/: each step
#   of the smoke test Vydat relies on; site-dark/ and smoke-dark/: the website's
#   shots again in dark mode, for its dark look), watch/ and watch-cs/: the Apple
#   Watch app on the sample day in English and Czech (the watch is dark only),
#   preview/: the App Store preview videos in English and Czech (app-preview-en.mp4,
#   app-preview-cs.mp4), and duo/: the sample day on the iPhone Duo simulator.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"
  pull_request:
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-native.yml"

permissions:
  contents: read

# A newer push to the same pull request cancels the older run: only the newest
# commit's result matters, and macOS runners are slow and few.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    # Xcode 27 lives on its own image (macos-latest still stops at Xcode 26.6):
    # only Xcode 27.1 and later build the app full screen on iPhone Duo.
    runs-on: xcode-27
    # On main the run also builds for iPhone and uploads it after the App Store
    # preview and the iPhone Duo screenshots: 81 to 97 minutes (cancelled at 60
    # and then 90 min before; the open Duo shots add 1 to 2), so 110.
    timeout-minutes: 110
    defaults:
      run:
        working-directory: ios-native
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      # The newest stable Xcode on the image (no beta or release candidate), and
      # what it carries: the run's log shows the Xcode, the iOS runtimes and
      # whether the iPhone Duo simulator is there. Xcode 26 and later bring
      # AlarmKit (the alarm in Nastavení → Spánek).
      - name: Pick Xcode
        run: |
          ls -d /Applications/Xcode*.app || true
          # Xcode_27.2.app on the xcode-27 image is a link to Xcode_27.2_Release_Candidate.app:
          # the real folder's name decides, so a release candidate is never picked.
          xcode=$(for x in /Applications/Xcode_*.app; do [ -d "$x" ] && echo "$(cd "$x" && pwd -P)"; done | sort -u | grep -vi -e beta -e release_candidate -e _rc | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode/Contents/Developer"; fi
          xcodebuild -version
          xcrun simctl list runtimes
          xcrun simctl list devicetypes | grep -i -e duo -e "iPhone 1[78]" || true

      # The licensed 3D muscle figure, from R2 into the bundle (never in the repository):
      # the sample day's screens and the App Store preview show it.
      - name: Put the 3D muscle model in the app
        env:
          MUSCLE_MODEL_R2_KEY_ID: ${{ secrets.MUSCLE_MODEL_R2_KEY_ID }}
          MUSCLE_MODEL_R2_SECRET: ${{ secrets.MUSCLE_MODEL_R2_SECRET }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: ../.github/scripts/fetch-muscle-model.sh

      # The team goes into the watch's Keychain group (project.yml); a
      # placeholder is enough for the simulator and the unsigned build.
      - name: Generate the Xcode project
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID || 'SIMULATOR' }}
        run: |
          brew install xcodegen
          xcodegen generate
          cat Aurin/Aurin.entitlements

      - name: Pick a simulator
        id: sim
        run: |
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import itertools, json, sys
          devices = json.load(sys.stdin)["devices"]
          # Only the numbers right after "iOS-": the xcode-27 image of 2026-11-04 also has
          # runtimes like "iOS-27-1-iPhone19" (a build for one device); the plain one goes first.
          version = lambda runtime: ([int(n) for n in itertools.takewhile(str.isdigit, runtime.split("iOS-")[-1].split("-"))], runtime.split("iOS-")[-1].replace("-", "").isdigit())
          # The newest iOS on the image first. (On the Xcode 26 image the oldest went
          # first: StoreKit testing loaded no products on the iOS 26.4/26.5 simulators.
          # On iOS 27.0 the first test purchase after boot asks to sign in to an
          # Apple Account and never ends.)
          runtimes = sorted((r for r in devices if "iOS" in r), key=version, reverse=True)
          print("runtimes:", ", ".join(runtimes), file=sys.stderr)
          # An ordinary iPhone, never the foldable iPhone Duo: it has two displays,
          # so plain screenshots fail (it gets its own step below). iOS 27.1 on
          # the xcode-27 image runs only the Duo (no other iPhone),
          # so the newest iOS that has an ordinary iPhone.
          ordinary = lambda r: [d for d in devices[r] if d["name"].startswith("iPhone") and "Duo" not in d["name"]]
          runtime = next(r for r in runtimes if ordinary(r))
          first = ordinary(runtime)
          print("iPhones on", runtime + ":", ", ".join(d["name"] for d in first), file=sys.stderr)
          names = ("iPhone 17", "iPhone 17 Pro", "iPhone 18 Pro", "iPhone 16", "iPhone 16 Pro")
          pick = next((d for n in names for d in first if d["name"] == n), first[0])
          print(pick["name"], file=sys.stderr)
          print(pick["udid"])')
          echo "udid=$udid" >> "$GITHUB_OUTPUT"

      # Unit tests render the screens to PNG (AurinTests/SnapshotTests.swift).
      # Test timeouts: a test that hangs (a StoreKit purchase that is never
      # answered) fails after its allowance instead of holding the run for 90 min.
      - name: Test and render screens
        env:
          TEST_RUNNER_SNAPSHOT_DIR: ${{ github.workspace }}/screens
        run: |
          mkdir -p "$GITHUB_WORKSPACE/screens/during-tests"
          # The simulator's screen once a minute while the tests run (during-tests/):
          # a system sheet that holds a test purchase up shows there.
          (set +e; while sleep 60; do xcrun simctl io "${{ steps.sim.outputs.udid }}" screenshot "$GITHUB_WORKSPACE/screens/during-tests/$(date +%H%M%S).png" >/dev/null 2>&1; done) &
          shots=$!
          set -o pipefail
          status=0
          run() {
            xcodebuild -project Aurin.xcodeproj -scheme Aurin -configuration Debug \
              -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
              -test-timeouts-enabled YES -default-test-execution-time-allowance 300 \
              -maximum-test-execution-time-allowance 600 \
              CODE_SIGNING_ALLOWED=NO "$@" 2>&1 | tee -a "$RUNNER_TEMP/build.log"
          }
          run build-for-testing || status=$?
          if [ "$status" = 0 ]; then
            # On iOS 27 every purchase in the first test process after the simulator
            # boots waits on a "Sign in to Apple Account" alert; one short test takes
            # that process (ProStoreTests.warmUp), the real run gets the next one.
            run test-without-building -only-testing:AurinTests/ProStoreTests/testTrialReminderOnDayFive || true
            run test-without-building || status=$?
          fi
          kill "$shots" || true
          exit $status

      # Warnings that are always a bug stop the run: Swift only warns about a
      # function that calls itself forever (GymStore.sync() did, and the watch
      # app crashed on every launch), code that can never run, and a cast that
      # can never succeed. The test build compiles the iPhone and the watch app.
      - name: Stop on warnings that are always bugs
        run: |
          log="$RUNNER_TEMP/build.log"
          grep -E '\.swift:[0-9]+:[0-9]+: warning: .*(infinite recursion|will never be executed|always fails)' "$log" | sed -E 's#^.*/ios-native/##' | sort -u > "$RUNNER_TEMP/bugs.txt" || true
          if [ -s "$RUNNER_TEMP/bugs.txt" ]; then
            while read -r line; do echo "::error::$line"; done < "$RUNNER_TEMP/bugs.txt"
            exit 1
          fi

      # When the app would not open on the simulator, the installer's own reason.
      - name: Why the app does not install
        if: failure()
        run: |
          app=build/Build/Products/Debug-iphonesimulator/Aurin.app
          find "$app/Watch" -maxdepth 4 -name Info.plist -exec sh -c 'echo "== $1"; plutil -p "$1"' _ {} \; || true
          xcrun simctl boot "${{ steps.sim.outputs.udid }}" || true
          xcrun simctl install "${{ steps.sim.outputs.udid }}" "$app" || true

      # The Swift concurrency warnings the compiler found (SWIFT_STRICT_CONCURRENCY
      # in project.yml), counted per file, so each round of fixes shows what is left.
      - name: Count concurrency warnings
        if: always()
        run: |
          log="$RUNNER_TEMP/build.log"
          [ -f "$log" ] || exit 0
          grep -E '\.swift:[0-9]+:[0-9]+: warning: ' "$log" | grep -iE 'sendable|actor|isolat|concurren|data race|nonisolated' | sort -u > "$RUNNER_TEMP/concurrency.txt" || true
          total=$(wc -l < "$RUNNER_TEMP/concurrency.txt" | tr -d ' ')
          {
            echo "### Concurrency warnings: $total"
            echo '```'
            sed -E 's#^.*/(ios-native/)?([^:]+\.swift):.*#\2#' "$RUNNER_TEMP/concurrency.txt" | sort | uniq -c | sort -rn | head -40
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "Concurrency warnings: $total"
          sed -E 's#^.*/(Aurin|Shared|AurinWidgets|AurinTests|AurinWatch|WatchShared)/#\1/#' "$RUNNER_TEMP/concurrency.txt" | head -300

      # The real app on the simulator with sample data, as the phone shows it.
      # The app follows the phone's language, so the English simulator is told Czech.
      - name: Screenshot the running app
        run: |
          udid=${{ steps.sim.outputs.udid }}
          xcrun simctl boot "$udid" || true
          xcrun simctl bootstatus "$udid" -b
          xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/Aurin.app
          for mode in light dark; do
            xcrun simctl ui "$udid" appearance "$mode"
            for tab in today training health food; do
              xcrun simctl launch --terminate-running-process "$udid" health.aurin.app -demo -tab "$tab" -AppleLanguages "(cs)"
              sleep 6
              xcrun simctl io "$udid" screenshot "$GITHUB_WORKSPACE/screens/simulator-$tab-$mode.png"
            done
          done

      # The website shows the real app (src/site-pages.js): English, light mode, sample
      # data and a clean status bar.
      - name: Screenshot the app for the website
        run: |
          udid=${{ steps.sim.outputs.udid }}
          mkdir -p "$GITHUB_WORKSPACE/screens/site"
          # Now and then a page opened from the launch comes out blank (an empty
          # white screen, under 300 kB) though it shows fine 7 s later in a
          # separate run: such a shot is taken again, up to twice, 10 s apart.
          shoot() {
            local f=$1 tries
            for tries in 1 2 3; do
              xcrun simctl io "$udid" screenshot "$f"
              [ "$(stat -f%z "$f")" -gt 300000 ] && return 0
              echo "Blank, again in 10 s: $f"
              sleep 10
            done
            echo "::warning::Still blank: $f"
          }
          xcrun simctl ui "$udid" appearance light
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 || true
          # The switch back from the dark shots above takes a while: without the wait
          # the first screens came out dark or dimmed halfway through the change.
          sleep 10
          for tab in today training health food; do
            xcrun simctl launch --terminate-running-process "$udid" health.aurin.app -demo -tab "$tab" -AppleLanguages "(en)" -AppleLocale en_US -language en
            sleep 6
            shoot "$GITHUB_WORKSPACE/screens/site/$tab.png"
          done
          # Screens one tap deeper, opened as their link would (-open; simctl openurl
          # stops on the system's "Open in Aurin?" question): readiness, strain, muscles, the gym session.
          for route in readiness strain muscles gym/2026-10-08; do
            xcrun simctl launch --terminate-running-process "$udid" health.aurin.app -demo -open "$route" -AppleLanguages "(en)" -AppleLocale en_US -language en
            sleep 7
            shoot "$GITHUB_WORKSPACE/screens/site/${route%%/*}.png"
          done

      # Before a release (Vydat checks this run): the app tapped through like a
      # person would, from a new phone's sign-in into the sample data and across
      # the main screens (AurinUITests/SmokeTests.swift). Fails on a crash or a
      # missing screen; a screenshot of each step goes to smoke/.
      - name: Smoke test of the main screens
        env:
          TEST_RUNNER_SMOKE_DIR: ${{ github.workspace }}/screens/smoke
        run: |
          xcrun simctl uninstall "${{ steps.sim.outputs.udid }}" health.aurin.app || true
          xcodebuild -project Aurin.xcodeproj -scheme AurinSmoke -configuration Debug \
            -destination "id=${{ steps.sim.outputs.udid }}" -derivedDataPath build \
            -skip-testing:AurinUITests/AppPreviewTests \
            CODE_SIGNING_ALLOWED=NO test

      # The website's shots again in dark mode (scripts/site-screens.mjs saves them as
      # public/site/app/*-dark.webp; the site's dark look waits for them, DARK_SITE in
      # src/design-system.js). The app's own Vzhled setting (-appearance) turns it dark.
      # Not a release check: a missing dark shot never fails the run.
      - name: Screenshot the app for the website in dark mode
        continue-on-error: true
        env:
          TEST_RUNNER_SMOKE_DIR: ${{ github.workspace }}/screens/smoke-dark
          TEST_RUNNER_SITE_APPEARANCE: dark
        run: |
          udid=${{ steps.sim.outputs.udid }}
          mkdir -p "$GITHUB_WORKSPACE/screens/site-dark"
          for tab in today training; do
            xcrun simctl launch --terminate-running-process "$udid" health.aurin.app -demo -tab "$tab" -AppleLanguages "(en)" -AppleLocale en_US -language en -appearance dark
            sleep 6
            xcrun simctl io "$udid" screenshot "$GITHUB_WORKSPACE/screens/site-dark/$tab.png"
          done
          xcrun simctl launch --terminate-running-process "$udid" health.aurin.app -demo -open muscles -AppleLanguages "(en)" -AppleLocale en_US -language en -appearance dark
          sleep 7
          xcrun simctl io "$udid" screenshot "$GITHUB_WORKSPACE/screens/site-dark/muscles.png"
          xcodebuild -project Aurin.xcodeproj -scheme AurinSmoke -configuration Debug \
            -destination "id=$udid" -derivedDataPath build \
            -only-testing:AurinUITests/SmokeTests/test4WebsiteScenes \
            CODE_SIGNING_ALLOWED=NO test

      # The Apple Watch app on the sample day (AurinWatch/WatchDemo.swift, -demo) for
      # the App Store and the website: watch/ in English, watch-cs/ in Czech, each
      # page by the crown, a detail, the gym and its rest, the watch face with
      # Aurin's complications (DemoFace) and a race day (a duathlon, -race). The watch is dark only. Not a release
      # check: a missing watch simulator or shot never fails the run.
      - name: Screenshot the Apple Watch
        continue-on-error: true
        # Usually 5 minutes. A stuck simulator call must not hold the whole run
        # past its time limit (a cancelled run keeps no log); the log names each shot.
        timeout-minutes: 15
        run: |
          watch=$(xcrun simctl list devices available -j | python3 -c '
          import json, sys
          devices = json.load(sys.stdin)["devices"]
          watches = [d for r in devices if "watchOS" in r for d in devices[r] if d["name"].startswith("Apple Watch")]
          print("watches:", ", ".join(sorted({d["name"] for d in watches})), file=sys.stderr)
          names = ("Apple Watch Series 12 (46mm)", "Apple Watch Series 11 (46mm)", "Apple Watch Ultra 3 (49mm)", "Apple Watch Series 10 (46mm)", "Apple Watch Ultra 2 (49mm)")
          # The App Store takes 416x496 (46 mm); a newer image may only have a newer 46 mm watch.
          pick = next((d for n in names for d in reversed(watches) if d["name"] == n), None) \
              or next((d for d in reversed(watches) if "(46mm)" in d["name"]), watches[-1] if watches else None)
          print(pick["name"] if pick else "no watch", file=sys.stderr)
          print(pick["udid"] if pick else "")')
          if [ -z "$watch" ]; then echo "No Apple Watch simulator on this image"; exit 0; fi
          app=build/Build/Products/Debug-watchsimulator/AurinWatch.app
          [ -d "$app" ] || app=$(find build/Build/Products -maxdepth 2 -name AurinWatch.app -path '*watchsimulator*' | head -1)
          xcrun simctl boot "$watch" || true
          xcrun simctl bootstatus "$watch" -b
          xcrun simctl install "$watch" "$app"
          shoot() {
            local out="$GITHUB_WORKSPACE/screens/$1" name=$2; shift 2
            mkdir -p "$out"
            echo "$(date +%H:%M:%S) ${out##*/}/$name $*"
            xcrun simctl launch --terminate-running-process "$watch" health.aurin.app.watchkitapp -demo "$@"
            sleep 6
            xcrun simctl io "$watch" screenshot "$out/$name.png"
          }
          for lang in en cs; do
            # The system's own texts (the time to the next workout, the clock) in
            # the shot's language too, not the simulator's English.
            dir=watch locale=en_US; [ "$lang" = cs ] && dir=watch-cs locale=cs_CZ
            set -- -language $lang -AppleLanguages "($lang)" -AppleLocale $locale
            shoot $dir 1-morning "$@"
            shoot $dir 2-training "$@" -page training -week
            shoot $dir 3-food "$@" -page food
            shoot $dir 4-gym "$@" -gym
            shoot $dir 5-rest "$@" -gym -rest
            shoot $dir 6-face "$@" -face
            shoot $dir 7-sleep "$@" -open sleep
            shoot $dir 8-strain "$@" -open strain
            # Race day: a sprint duathlon as one card with Open in Workout (WatchDemo -race).
            shoot $dir 9-race "$@" -page training -race
          done
          xcrun simctl shutdown "$watch" || true

      # The App Store preview videos: the simulator's screen recorded while
      # AppPreviewTests walks the sample day in English and Czech, then the clips
      # it marks cut into one 15–30 s video per language (scripts/app-preview.mjs).
      # Never fails the run: the videos are for the store page, not the release.
      - name: Record the App Store preview
        continue-on-error: true
        env:
          TEST_RUNNER_PREVIEW_DIR: ${{ github.workspace }}/screens/preview
        run: |
          udid=${{ steps.sim.outputs.udid }}
          dir="$GITHUB_WORKSPACE/screens/preview"
          mkdir -p "$dir"
          xcrun simctl ui "$udid" appearance light
          xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 || true
          xcrun simctl io "$udid" recordVideo --codec=h264 --force "$dir/recording.mp4" 2> "$RUNNER_TEMP/record.log" &
          recorder=$!
          for _ in $(seq 1 50); do grep -q "Recording started" "$RUNNER_TEMP/record.log" && break; sleep 0.2; done
          python3 -c 'import time; print(f"{time.time():.3f}")' > "$dir/started.txt"
          set +e
          xcodebuild -project Aurin.xcodeproj -scheme AurinSmoke -configuration Debug \
            -destination "id=$udid" -derivedDataPath build \
            -only-testing:AurinUITests/AppPreviewTests \
            CODE_SIGNING_ALLOWED=NO test-without-building
          status=$?
          set -e
          kill -INT "$recorder"
          wait "$recorder" || true
          cat "$RUNNER_TEMP/record.log"
          cat "$dir/marks.txt" || true
          command -v ffmpeg >/dev/null || brew install --quiet ffmpeg
          node "$GITHUB_WORKSPACE/scripts/app-preview.mjs" "$dir"
          rm -f "$dir/recording.mp4"
          exit $status

      # The app on iPhone Duo, Apple's foldable (Xcode 27.1 and later have its
      # simulator): the sample day in English and light mode, each display the
      # simulator shows (duo/), Today and Training also unfolded (duo/open-*).
      # Not a release check: never fails the run, and never holds it either: on
      # main 2026-11-03 it hung for 28 minutes and the whole run hit its time
      # limit before Build for iPhone, so no upload. Booting and nine screens
      # take 4 to 12 minutes (a slow runner needs 2 min to boot and 4 to install).
      - name: Screenshot the app on iPhone Duo
        continue-on-error: true
        # Each simctl call below has its own limit too, so a stuck one is named
        # in the log and the rest still runs.
        timeout-minutes: 15
        run: |
          # Every simulator off first: the Duo boots with two displays and the
          # earlier steps' iPhone (and its recording) left running starved it.
          xcrun simctl shutdown all || true
          # A simctl call that does not end in $1 seconds is stopped and named.
          # The guard writes only to fd 3 (the log), never to a $(...) it runs in,
          # so a capture does not wait for its sleep.
          exec 3>&2
          limit() {
            local secs=$1; shift
            echo "$(date +%H:%M:%S) $*" >&3
            "$@" & local pid=$!
            ( sleep "$secs"; kill -9 "$pid" 2>/dev/null && echo "::warning::Stopped after ${secs}s: $*" >&3 ) >/dev/null 2>&1 & local guard=$!
            wait "$pid"; local status=$?
            kill "$guard" 2>/dev/null; wait "$guard" 2>/dev/null
            return $status
          }
          udid=$(xcrun simctl list devices available -j | python3 -c '
          import itertools, json, sys
          devices = json.load(sys.stdin)["devices"]
          # Only the numbers right after "iOS-": the xcode-27 image of 2026-11-04 also has
          # runtimes like "iOS-27-1-iPhone19" (a build for one device); the plain one goes first.
          version = lambda runtime: ([int(n) for n in itertools.takewhile(str.isdigit, runtime.split("iOS-")[-1].split("-"))], runtime.split("iOS-")[-1].replace("-", "").isdigit())
          runtimes = sorted((r for r in devices if "iOS" in r), key=version, reverse=True)
          duo = [d for r in runtimes for d in devices[r] if "Duo" in d["name"]]
          print(duo[0]["udid"] if duo else "")')
          if [ -z "$udid" ]; then
            type=$(xcrun simctl list devicetypes | grep -i "iPhone Duo" | head -1 | sed -E 's/.*\((com\.apple[^)]*)\).*/\1/')
            runtime=$(xcrun simctl list runtimes | grep -E "^iOS" | tail -1 | sed -E 's/.* - (com\.apple[^ ]*).*/\1/')
            if [ -z "$type" ]; then echo "::warning::No iPhone Duo simulator on this image"; exit 0; fi
            udid=$(xcrun simctl create "iPhone Duo" "$type" "$runtime")
          fi
          dir="$GITHUB_WORKSPACE/screens/duo"
          mkdir -p "$dir"
          limit 60 xcrun simctl boot "$udid" || true
          limit 180 xcrun simctl bootstatus "$udid" -b || exit 0
          limit 240 xcrun simctl install "$udid" build/Build/Products/Debug-iphonesimulator/Aurin.app || exit 0
          limit 60 xcrun simctl ui "$udid" appearance light || true
          limit 30 xcrun simctl status_bar "$udid" override --time "9:41" --batteryState charged --batteryLevel 100 --wifiBars 3 --cellularMode active --cellularBars 4 || true
          # The Duo simulator has two displays (outer LCD and the inner, unfolded
          # LCD-1); a plain screenshot then refuses and lists them. Each shot
          # tries the plain one and, when refused, takes every listed display:
          # the file name says which display and its size. Asked per shot, not
          # once up front: the first screenshot after boot can take over 30 s.
          displays=""
          shoot() {
            if [ -z "$displays" ]; then
              local out; out=$(limit 90 xcrun simctl io "$udid" screenshot "$dir/$1.png" 2>&1) || true
              displays=$(printf '%s\n' "$out" | sed -nE 's/.*--display=([0-9]+) +([^ ]+).* ([0-9]+x[0-9]+).*/\1:\2-\3/p')
              [ -n "$displays" ] || return 0
              echo "displays: $displays"
            fi
            for d in $displays; do
              limit 90 xcrun simctl io "$udid" screenshot --display="${d%%:*}" "$dir/$1-${d#*:}.png" || true
            done
          }
          # The first screenshot after boot is slow (over 45 s): one that is
          # thrown away, so Today's is not the one that waits.
          limit 30 xcrun simctl launch "$udid" health.aurin.app -demo || true
          sleep 7
          shoot warmup
          rm -f "$dir"/warmup*.png
          # The open Duo (inner display, landscape 951x669 pt): simctl has no fold
          # command, so .github/scripts/duo-hinge.m sends the hinge event Device
          # Hub's "Open" sends (vendored, MIT). Today and Training first, so a
          # slow runner still gets them; then folded again for the cover shots.
          # Files open-<tab>-<display>.png: the inner display is the larger one.
          if limit 60 clang -fobjc-arc -framework Foundation -o "$RUNNER_TEMP/duo-hinge" "$GITHUB_WORKSPACE/.github/scripts/duo-hinge.m" \
            && DEVELOPER_DIR="$(xcode-select -p)" limit 30 "$RUNNER_TEMP/duo-hinge" -d "$udid" flat; then
            sleep 3
            for tab in today training; do
              limit 30 xcrun simctl launch --terminate-running-process "$udid" health.aurin.app -demo -tab "$tab" -AppleLanguages "(en)" -AppleLocale en_US -language en || continue
              sleep 7
              shoot "open-$tab"
              # A blank (white, under 300 kB) inner shot, as on the iPhone above
              # (Training once came out so): taken again, up to twice, 10 s apart.
              for try in 1 2; do
                inner=$(ls -S "$dir/open-$tab"-*.png 2>/dev/null | head -1)
                [ -n "$inner" ] && [ "$(stat -f%z "$inner")" -lt 300000 ] || break
                echo "Blank, again in 10 s: $inner"
                sleep 10
                shoot "open-$tab"
              done
            done
            DEVELOPER_DIR="$(xcode-select -p)" limit 30 "$RUNNER_TEMP/duo-hinge" -d "$udid" closed || true
            sleep 3
          else
            echo "::warning::Could not unfold the iPhone Duo simulator; open shots skipped"
          fi
          for tab in today training health food; do
            limit 30 xcrun simctl launch --terminate-running-process "$udid" health.aurin.app -demo -tab "$tab" -AppleLanguages "(en)" -AppleLocale en_US -language en || continue
            sleep 7
            shoot "$tab"
          done
          # Muscles last and with a longer wait: its 3D figure loads after launch,
          # and a screenshot taken meanwhile on the Duo hung past its limit.
          for route in readiness gym/2026-10-08 muscles; do
            limit 30 xcrun simctl launch --terminate-running-process "$udid" health.aurin.app -demo -open "$route" -AppleLanguages "(en)" -AppleLocale en_US -language en || continue
            if [ "$route" = muscles ]; then sleep 20; else sleep 7; fi
            shoot "${route%%/*}"
          done
          limit 60 xcrun simctl shutdown "$udid" || true

      # Unsigned: Sideloadly signs it with the user's Apple ID.
      - name: Build for iPhone
        if: github.event_name != 'pull_request'
        run: |
          # No -sdk: it would build the embedded watch app for iOS too; the
          # destination alone picks the watchOS SDK for it, like the archive.
          xcodebuild -project Aurin.xcodeproj -scheme Aurin -configuration Release \
            -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO build
          mkdir -p ipa/Payload
          cp -R build/Build/Products/Release-iphoneos/Aurin.app ipa/Payload/
          # The artifact can be downloaded from the public repository: the licensed
          # 3D figure stays out of it (the app downloads it after sign-in).
          rm -f ipa/Payload/Aurin.app/muscles-v1.bin
          # Ad-hoc signatures carry the App Group the widgets share with the
          # app; Sideloadly re-signs with the user's Apple ID and keeps them.
          app=ipa/Payload/Aurin.app
          codesign --force --sign - --entitlements AurinWidgets/AurinWidgets.entitlements "$app/PlugIns/AurinWidgets.appex"
          codesign --force --sign - "$app/PlugIns/AurinNotifications.appex"
          codesign --force --sign - "$app/PlugIns/AurinMorning.appex"
          codesign --force --sign - --entitlements AurinWatchWidgets/AurinWatchWidgets.entitlements "$app/Watch/AurinWatch.app/PlugIns/AurinWatchWidgets.appex"
          codesign --force --sign - --entitlements AurinWatch/AurinWatch.entitlements "$app/Watch/AurinWatch.app"
          codesign --force --sign - --entitlements Aurin/Aurin.entitlements "$app"
          (cd ipa && zip -qry "$GITHUB_WORKSPACE/Aurin-unsigned.ipa" Payload)

      - name: Upload the app
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Aurin-ios
          path: Aurin-unsigned.ipa
          retention-days: 30

      - name: Upload the screens
        if: always()
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: Aurin-screens
          path: screens
          if-no-files-found: ignore
          retention-days: 30
