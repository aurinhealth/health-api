name: Database backup

# Every Saturday night: the central database and every user data database
# go to the R2 bucket aurin-db-backups (EU), kept 28 days, encrypted with age
# on the runner before upload (scripts/backup-recipients.txt). A D1 export makes
# the database wait for a moment, so it runs when nobody trains. GitHub starts
# this schedule 6 to 7 hours late (01:30 ran at 07:51-08:19 UTC in November
# 2026, and the 15 Nov export made five background jobs fail once), so it is
# set for Saturday 21:30 UTC: on time or late, it runs at night in Europe.
on:
  workflow_dispatch:
  schedule:
    - cron: "30 21 * * 6"

permissions:
  contents: read

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Its own environment: main only, but no approval, so the night run never
    # waits for a click while it holds production-deploy.
    environment: backup
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Install age
        run: sudo apt-get update -qq && sudo apt-get install -y -qq age && age --version

      - name: Export databases to R2
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/backup-databases.mjs
