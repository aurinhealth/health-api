name: iOS TestFlight

# Signs the native app (ios-native/) with the paid Apple Developer account
# and uploads it to TestFlight. No certificate or profile lives in the repo:
# Xcode signs in the cloud with an App Store Connect API key (Admin role)
# and creates the App Store profiles itself (-allowProvisioningUpdates).
#
# Secrets of the testflight environment (main only), and of testflight-pr for
# a pull request's run, which waits for the owner's approval (Settings →
# Environments; docs/test-server-and-releases.md):
# - APPLE_TEAM_ID: the 10-character Team ID (developer.apple.com → Membership)
# - ASC_KEY_ID: the API key's Key ID
# - ASC_ISSUER_ID: the Issuer ID above the list of keys
# - ASC_KEY_P8: the whole contents of the downloaded AuthKey_XXXX.p8
# Without them the workflow skips the upload and stays green.
#
# Every build gets "What to Test" in TestFlight, in Czech: the TestFlight
# sections of the pull requests merged since the last build uploaded from main
# (.github/scripts/testflight_notes.py), or the text typed in when the
# workflow is run by hand. A separate Linux job sets it, because App Store
# Connect can take over 20 minutes to list a new build.

on:
  workflow_dispatch:
    inputs:
      what_to_test:
        description: "What to Test (empty: the changes since the last build)"
        required: false
        default: ""
  push:
    branches:
      - main
    paths:
      - "ios-native/**"
      - ".github/workflows/ios-testflight.yml"
  # A change to this pipeline is tried on its pull request, upload included,
  # once the owner approves it (testflight-pr).
  pull_request:
    paths:
      - ".github/workflows/ios-testflight.yml"

permissions:
  contents: read
  # Finds the last build uploaded from main for "What to Test".
  actions: read

jobs:
  testflight:
    runs-on: macos-15
    timeout-minutes: 40
    environment: ${{ github.event_name == 'pull_request' && 'testflight-pr' || 'testflight' }}
    # One upload at a time; the notes job below doesn't hold the next one up.
    concurrency:
      group: ios-testflight
      cancel-in-progress: false
    outputs:
      uploaded: ${{ steps.upload.outcome == 'success' }}
      version: ${{ steps.archive.outputs.version }}
    defaults:
      run:
        working-directory: ios-native
    steps:
      - name: Check the signing secrets
        id: secrets
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        working-directory: .
        run: |
          missing=""
          for name in APPLE_TEAM_ID ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8; do
            if [ -z "${!name}" ]; then missing="$missing $name"; fi
          done
          if [ -n "$missing" ]; then
            echo "::warning::TestFlight skipped, missing secrets:$missing"
            echo "ready=false" >> "$GITHUB_OUTPUT"
          else
            echo "ready=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout repository
        if: steps.secrets.outputs.ready == 'true'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # The same Xcode as ios-native.yml: Xcode 26 for the iOS 26 SDK, which
      # App Store Connect also requires for new uploads.
      - name: Pick Xcode
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcode=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | grep -vi -e beta -e release_candidate | sort -V | tail -1)
          if [ -n "$xcode" ]; then sudo xcode-select -s "$xcode/Contents/Developer"; fi
          xcodebuild -version

      - name: Generate the Xcode project
        if: steps.secrets.outputs.ready == 'true'
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Write the API key
        if: steps.secrets.outputs.ready == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      # Archived without a certificate; the entitlements (App Group) go in
      # with an ad-hoc signature, and the export below signs it for real.
      # The build number is this workflow's run number, so every upload is
      # higher than the last.
      - name: Archive
        id: archive
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          xcodebuild -project Aurin.xcodeproj -scheme Aurin -configuration Release \
            -destination 'generic/platform=iOS' -archivePath build/Aurin.xcarchive \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" CURRENT_PROJECT_VERSION="${{ github.run_number }}" \
            CODE_SIGNING_ALLOWED=NO archive
          app=build/Aurin.xcarchive/Products/Applications/Aurin.app
          codesign --force --sign - --entitlements AurinWidgets/AurinWidgets.entitlements "$app/PlugIns/AurinWidgets.appex"
          codesign --force --sign - "$app/PlugIns/AurinNotifications.appex"
          codesign --force --sign - --entitlements AurinWatch/AurinWatch.entitlements "$app/Watch/AurinWatch.app"
          codesign --force --sign - --entitlements Aurin/Aurin.entitlements "$app"
          echo "version=$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' "$app/Info.plist")" >> "$GITHUB_OUTPUT"

      # The Apple Watch app's ID needs HealthKit for its gym workout; the
      # export below makes its profile but adds no capability to an ID it
      # already registered.
      - name: Turn on HealthKit for the watch app
        if: steps.secrets.outputs.ready == 'true'
        working-directory: .
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
        run: python3 .github/scripts/asc_capability.py health.aurin.app.watchkitapp HEALTHKIT

      # Cloud-managed Apple Distribution certificate, App Store profiles
      # created on the fly, and the upload straight to App Store Connect.
      - name: Sign and upload to TestFlight
        id: upload
        if: steps.secrets.outputs.ready == 'true'
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
        run: |
          cat > build/ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store-connect</string>
            <key>destination</key><string>upload</string>
            <key>signingStyle</key><string>automatic</string>
            <key>teamID</key><string>$APPLE_TEAM_ID</string>
            <key>manageAppVersionAndBuildNumber</key><false/>
            <key>uploadSymbols</key><true/>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath build/Aurin.xcarchive \
            -exportOptionsPlist build/ExportOptions.plist -exportPath build/export \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "Uploaded build ${{ github.run_number }}; it shows in TestFlight once Apple finishes processing it." >> "$GITHUB_STEP_SUMMARY"

      - name: Remove the API key
        if: always()
        working-directory: .
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"

  notes:
    needs: testflight
    if: needs.testflight.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 75
    environment: ${{ github.event_name == 'pull_request' && 'testflight-pr' || 'testflight' }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0

      # The pull requests since the last build: this pull request itself, or
      # the ones merged since the commit of the last successful upload from main.
      - name: Write What to Test
        env:
          GH_TOKEN: ${{ github.token }}
          TYPED: ${{ github.event.inputs.what_to_test }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          mkdir -p build
          notes=build/WhatToTest.txt
          if [ -n "$TYPED" ]; then
            printf '%s\n' "$TYPED" > "$notes"
          else
            base=""
            if [ "${{ github.event_name }}" != pull_request ]; then
              base=$(gh run list --repo "$GITHUB_REPOSITORY" --workflow ios-testflight.yml --branch main \
                --status success --limit 1 --json headSha --jq '.[0].headSha // ""')
            fi
            # Unknown, gone, or this very commit again: just the last commit.
            if [ -z "$base" ] || ! git cat-file -e "$base^{commit}" 2>/dev/null || [ "$(git rev-parse "$base")" = "$(git rev-parse HEAD)" ]; then
              base=$(git rev-parse HEAD~1)
            fi
            python3 .github/scripts/testflight_notes.py write "$base" "$notes"
          fi
          { echo "### What to Test"; echo; cat "$notes"; } >> "$GITHUB_STEP_SUMMARY"

      - name: Set What to Test in TestFlight
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          ASC_KEY_PATH: ${{ runner.temp }}/AuthKey.p8
          BUNDLE_ID: health.aurin.app
          MARKETING_VERSION: ${{ needs.testflight.outputs.version }}
          BUILD_NUMBER: ${{ github.run_number }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$ASC_KEY_PATH"
          chmod 600 "$ASC_KEY_PATH"
          python3 .github/scripts/testflight_notes.py upload build/WhatToTest.txt

      - name: Remove the API key
        if: always()
        run: rm -f "$RUNNER_TEMP/AuthKey.p8"
