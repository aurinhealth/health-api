name: One-time food log

on:
  push:
    branches:
      - main
    paths:
      - "automation/food-log-request.json"

permissions:
  contents: read

jobs:
  log:
    runs-on: ubuntu-latest
    steps:
      - name: Log requested food
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f automation/food-log-request.json ]; then
            echo "No request file; nothing to do."
            exit 0
          fi
          body="$(cat automation/food-log-request.json)"
          response="$(curl -sS -w '\n%{http_code}' -X POST             -H "Content-Type: application/json"             --data "$body"             "https://petrfitnessdata.eu/app/api/nutrition/log")"
          code="${response##*$'\n'}"
          result="${response%$'\n'*}"
          echo "$result"
          if [ "$code" -lt 200 ] || [ "$code" -ge 300 ]; then
            exit 1
          fi
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d' <<< "$result"
