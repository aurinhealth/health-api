name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .
      - name: Smoke test MCP endpoint
        shell: bash
        run: |
          set -euo pipefail
          init="$(curl -fsS -X POST -H "Authorization: Bearer health-strength-demo-2026" -H "Content-Type: application/json" -H "MCP-Protocol-Version: 2026-07-28" --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{}}}' "https://health-api.chelseafc-czsk.workers.dev/mcp")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["result"]["protocolVersion"]=="2026-07-28"; assert d["result"]["serverInfo"]["name"]=="health-api-strength-coach"' <<< "$init"
          discover="$(curl -fsS -X POST -H "Authorization: Bearer health-strength-demo-2026" -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -H "MCP-Protocol-Version: 2026-07-28" -H "Mcp-Method: server/discover" --data '{"jsonrpc":"2.0","id":3,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci-smoke-test","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' "https://health-api.chelseafc-czsk.workers.dev/mcp")"
          python -c 'import json,sys; d=json.load(sys.stdin); r=d["result"]; assert r["resultType"]=="complete"; assert "2026-07-28" in r["supportedVersions"]; assert r["_meta"]["io.modelcontextprotocol/serverInfo"]["name"]=="health-api-strength-coach"' <<< "$discover"
          tools="$(curl -fsS -X POST -H "Authorization: Bearer health-strength-demo-2026" -H "Content-Type: application/json" -H "MCP-Protocol-Version: 2026-07-28" --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "https://health-api.chelseafc-czsk.workers.dev/mcp")"
          python -c 'import json,sys; d=json.load(sys.stdin); names={x["name"] for x in d["result"]["tools"]}; assert "generateStrengthPlan" in names and "syncStrengthSheet" in names' <<< "$tools"
      - name: Refresh strength sheets
        shell: bash
        run: |
          set -euo pipefail
          response="$(curl -fsSL \
            -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          curl --fail-with-body -sS \
            -X POST \
            -H "Authorization: Bearer $token" \
            -H "Content-Type: application/json" \
            --data '{"action":"sheet_maintenance","date":null,"preview":false}' \
            "https://health-api.chelseafc-czsk.workers.dev/automation/strength"
          curl --fail-with-body -sS "https://health-api.chelseafc-czsk.workers.dev/sync/intervals"
