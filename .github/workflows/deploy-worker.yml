name: Deploy Cloudflare Worker

# Two servers run the same code with separate data:
# - staging (health-api-staging, https://staging.aurin.health): every merge to
#   main lands here first; internal testers switch the app to it.
# - production (health-api, https://aurin.health): only the "Vydat" workflow
#   (vydat.yml) deploys it, with the newest main. Run this by hand with target
#   production for a server-only fix. Both servers only take commits on main.
# The Cloudflare token is a secret of the job's GitHub environment, production
# or staging (docs/test-server-and-releases.md, "Who can deploy").
on:
  workflow_dispatch:
    inputs:
      target:
        description: "Server"
        type: choice
        options: [staging, production]
        default: staging
      ref:
        description: "Commit to deploy (empty: the newest main)"
        required: false
        default: ""
  workflow_call:
    inputs:
      target:
        type: string
        required: true
      ref:
        type: string
        required: true
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - "migrations/**"
      - "after-deploy/**"
      - "staging/**"
      - "food-migrations/**"
      - "scripts/*food-catalog*.mjs"
      - "scripts/provision-user-shards.mjs"
      - "scripts/verify-user-shards.mjs"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read
  deployments: write
  id-token: write

env:
  # A push to main deploys staging.
  TARGET: ${{ inputs.target || 'staging' }}
  REF: ${{ inputs.ref || github.sha }}

jobs:
  # A red test suite never reaches production (or the D1 migrations).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    # The exact commits tested here are the ones the deploy job checks out and
    # deploys: a branch name or the prompts' main could move in between
    # (security audit 2026-11-04, points 20 and 27).
    outputs:
      sha: ${{ steps.pin.outputs.sha }}
      prompts: ${{ steps.pin.outputs.prompts }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ env.REF }}
          persist-credentials: false

      # The prompts token is not kept in the checkout, so later steps never see it (point 26).
      - name: Check out the private AI prompts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: aurinhealth/aurin-prompts
          token: ${{ secrets.PROMPTS_REPO_TOKEN }}
          path: src/private
          persist-credentials: false

      - name: Pin the commits
        id: pin
        shell: bash
        run: |
          set -euo pipefail
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "prompts=$(git -C src/private rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      # The tenancy tests use node:sqlite, available from Node 22.
      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      - name: Check syntax
        run: npm run check

      - name: Lint (undefined variables)
        run: npm run lint:install && npm run lint

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Production waits for the owner's approval; both take commits on main only.
    environment: ${{ inputs.target == 'production' && 'production' || 'staging' }}
    # One deploy per server at a time; staging never waits for production.
    concurrency:
      group: ${{ inputs.target == 'production' && 'production-deploy' || 'staging-deploy' }}
      cancel-in-progress: false
    env:
      WORKER: ${{ inputs.target == 'production' && 'health-api' || 'health-api-staging' }}
      DATABASE: ${{ inputs.target == 'production' && 'health-data' || 'health-data-staging' }}
      HOST: ${{ inputs.target == 'production' && 'aurin.health' || 'staging.aurin.health' }}
      ENV_ARGS: ${{ inputs.target == 'production' && ' ' || '--env staging' }}
      STAGING_FLAG: ${{ inputs.target == 'production' && ' ' || '--staging' }}
    steps:
      # Only main reaches either server: a branch commit would be overwritten by
      # the next merge or release, and Vydat relies on production being part of
      # main. It runs first, before any code of the commit or any secret, and
      # checks the exact commit the test job tested (points 20 and 21).
      - name: Check the commit is on main
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ needs.test.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          [[ "$SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "::error::Neznámý commit ($SHA)."; exit 1; }
          status="$(gh api "repos/$GITHUB_REPOSITORY/compare/main...$SHA" --jq .status)"
          case "$status" in
            identical|behind) ;;
            *) echo "::error::Commit ${SHA::7} není v main ($status), na server jde jen main."; exit 1 ;;
          esac

      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.test.outputs.sha }}
          persist-credentials: false

      - name: Check out the private AI prompts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: aurinhealth/aurin-prompts
          ref: ${{ needs.test.outputs.prompts }}
          token: ${{ secrets.PROMPTS_REPO_TOKEN }}
          path: src/private
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: "22"

      # The owner's address is not in the repository (wrangler.jsonc): it comes from
      # the environment's secret OWNER_EMAIL. Without it nobody would be the owner,
      # so nothing is deployed.
      - name: Check the owner e-mail
        env:
          OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
        shell: bash
        run: |
          if [[ ! "$OWNER_EMAIL" =~ ^[^[:space:]@]+@[^[:space:]@]+\.[^[:space:]@]+$ ]]; then
            echo "::error::Chybí secret OWNER_EMAIL v GitHub prostředí '${{ inputs.target == 'production' && 'production' || 'staging' }}' (Settings → Environments)."
            exit 1
          fi

      # Sign-ins are signed with SESSION_SECRET only (src/dashboard-auth.js) and
      # the connections are encrypted with CONNECTION_KEY only (connection-secrets.js).
      # Without them nobody could sign in or connect, so nothing is deployed.
      # Without TURNSTILE_SECRET_KEY the website's waitlist takes nobody
      # (src/testflight-waitlist.js), so the live server needs it too.
      - name: Check Worker secrets
        if: env.TARGET == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4.147.0 secret list | node scripts/require-secrets.mjs SESSION_SECRET CONNECTION_KEY TURNSTILE_SECRET_KEY

      # The test server's own database starts empty: the tables that predate
      # the migrations first (a no-op once they exist).
      - name: Prepare the test server database
        if: env.TARGET == 'staging'
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 execute health-data-staging --remote --env staging --file staging/schema.sql
          wranglerVersion: "4.147.0"

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply ${{ env.DATABASE }} --remote ${{ env.ENV_ARGS }}
          wranglerVersion: "4.147.0"

      - name: Prepare isolated user data databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-user-shards.mjs ${{ env.STAGING_FLAG }}

      - name: Prepare independent food catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-food-catalog.mjs ${{ env.STAGING_FLAG }}

      # A secret saved in the Cloudflare dashboard marks the Worker as last
      # deployed from the dashboard. Wrangler then downloads the dashboard
      # config before every deploy, and that call times out for this Worker.
      # Saving a harmless secret through Wrangler first clears the mark.
      # The test server's first deploy creates its Worker, so there is no mark yet.
      - name: Clear the dashboard deploy mark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          code="$(curl -sS -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $CLOUDFLARE_API_TOKEN" "https://api.cloudflare.com/client/v4/accounts/$CLOUDFLARE_ACCOUNT_ID/workers/scripts/$WORKER/settings")"
          if [ "$code" = "404" ]; then echo "$WORKER does not exist yet"; exit 0; fi
          printf 'wrangler' | npx --yes wrangler@4.147.0 secret put DEPLOY_SOURCE --name "$WORKER"

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@2ef9f398b9175c68f953e40d679493850d640a85 # v4.1.3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.runtime.jsonc ${{ env.ENV_ARGS }} --var OWNER_EMAIL:${{ secrets.OWNER_EMAIL }}
          workingDirectory: .
          wranglerVersion: "4.147.0"

      # The website's waitlist approves people into TestFlight (src/testflight-waitlist.js)
      # with the App Store Connect key: secrets ASC_KEY_ID, ASC_ISSUER_ID, ASC_KEY_P8 of the
      # production environment, the same values as in "testflight". Without them only
      # Schválit stops working, so the deploy goes on. The test server never gets the key
      # (security audit 2026-11-04, point 19).
      - name: Hand the App Store Connect key to the server
        if: env.TARGET == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
          EXTERNAL_GROUP: ${{ vars.EXTERNAL_GROUP }}
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$ASC_KEY_ID" ] || [ -z "$ASC_ISSUER_ID" ] || [ -z "$ASC_KEY_P8" ]; then
            echo "::notice::Bez ASC_KEY_ID, ASC_ISSUER_ID a ASC_KEY_P8 v GitHub prostředí nejde schvalovat zájemce z waitlistu."
            exit 0
          fi
          for name in ASC_KEY_ID ASC_ISSUER_ID ASC_KEY_P8 EXTERNAL_GROUP; do
            value="${!name}"
            [ -n "$value" ] || continue
            printf '%s' "$value" | npx --yes wrangler@4.147.0 secret put "$name" --name "$WORKER" > /dev/null
          done
          echo "App Store Connect key handed to $WORKER"

      # Keys the test server makes for itself: session signing and the
      # encryption of connected services' keys. Generated once, never shown,
      # and different from the live server's, so a live session never works there.
      - name: Generate the test server's own keys
        if: env.TARGET == 'staging'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          names="$(npx --yes wrangler@4.147.0 secret list --name "$WORKER")"
          for name in SESSION_SECRET CONNECTION_KEY; do
            if grep -q "\"name\": *\"$name\"" <<< "$names"; then continue; fi
            openssl rand -base64 48 | tr -d '\n' | npx --yes wrangler@4.147.0 secret put "$name" --name "$WORKER" > /dev/null
            echo "Generated $name"
          done

      # The first requests after a deploy may finish a database upgrade in
      # chunks; the API answers 503 until it is done.
      - name: Wait for the database upgrade
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            # Anonymous /app/api/me answers 401 once the upgrade is done (503
            # while upgrading). The answer carries no routing headers: they
            # told the internet how the data is split (pentest 2026-10-25).
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://$HOST/app/api/me" || true)"
            if [ "$code" = "401" ]; then echo "API ready"; exit 0; fi
            echo "Waiting for the new version and database upgrade (HTTP $code, attempt $attempt)"; sleep 10
          done
          echo "Database upgrade did not finish in time"; exit 1

      # Google sign-in returns to https://$HOST/auth/app/return, which iOS hands to the
      # app only when this file names it (APPLE_TEAM_ID, src/apple-app-site-association.js).
      - name: Check the app's associated domain file
        shell: bash
        run: |
          set -euo pipefail
          curl -sS --fail "https://$HOST/.well-known/apple-app-site-association" -o aasa.json || { echo "apple-app-site-association is not served on $HOST: set APPLE_TEAM_ID"; exit 1; }
          node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{const apps=JSON.parse(s).webcredentials?.apps||[];if(!apps.some(a=>/^[A-Z0-9]{10}\.health\.aurin\.app$/.test(a))){console.error("No webcredentials entry for health.aurin.app");process.exit(1)}console.log("Associated domain ready")})' < aasa.json

      - name: Verify independent user databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-user-shards.mjs ${{ env.STAGING_FLAG }}

      # Once the new version answers: data changes the previous one could undo meanwhile.
      - name: Apply after-deploy data changes
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-user-shards.mjs ${{ env.STAGING_FLAG }} --after-deploy

      - name: Activate user data routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-user-shards.mjs ${{ env.STAGING_FLAG }} --activate

      - name: Migrate and verify food catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-food-catalog.mjs ${{ env.STAGING_FLAG }} --migrate

      # Live Worker events during the smoke tests, so a platform error (for
      # example 1102, resource limits) shows its outcome and exceptions.
      - name: Start Worker tail
        if: env.TARGET == 'production'
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          nohup npx --yes wrangler@4.147.0 tail health-api --format json > "$RUNNER_TEMP/tail.jsonl" 2> "$RUNNER_TEMP/tail.err" &
          sleep 15

      - name: Request GitHub OIDC token for strength smoke test
        if: env.TARGET == 'production'
        id: oidc_strength
        shell: bash
        run: |
          set -euo pipefail
          response=""
          for attempt in 1 2 3; do
            if response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"; then
              break
            fi
            sleep $((attempt * 5))
          done
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Live strength generation smoke test
        if: env.TARGET == 'production'
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          date_value="$(TZ=Europe/Prague date +%F)"
          # Keep the response body on failure so the cause is visible in the log.
          response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data "{\"action\":\"generate\",\"date\":\"$date_value\",\"preview\":true}" "https://aurin.health/automation/strength")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ]; then
            # The repository and its Actions logs are public: a summary of the
            # response and the Worker's outcome and exceptions, never the plan
            # itself, the request headers or the Worker's own log lines.
            echo "HTTP $code"
            node scripts/ci-summary.mjs <<< "$body"
            sleep 5
            python - "$RUNNER_TEMP/tail.jsonl" <<'PY' || true
          import json, sys, re
          text = open(sys.argv[1], encoding="utf-8", errors="ignore").read()
          dec = json.JSONDecoder(); i = 0; events = []
          while True:
              m = re.compile(r"\{").search(text, i)
              if not m: break
              try:
                  obj, end = dec.raw_decode(text, m.start()); events.append(obj); i = end
              except ValueError:
                  i = m.start() + 1
          for e in events:
              req = (e.get("event") or {}).get("request") or {}
              print(json.dumps({"url": str(req.get("url", "")).split("?")[0], "outcome": e.get("outcome"), "cpuTime": e.get("cpuTime"), "wallTime": e.get("wallTime"), "exceptions": [str(x.get("name", "")) + ": " + str(x.get("message", ""))[:300] for x in e.get("exceptions") or []]}, ensure_ascii=False)[:3000])
          PY
            head -c 2000 "$RUNNER_TEMP/tail.err" || true
            exit 1
          fi
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", "status="+str(d.get("status")); assert d.get("preview") is True, "not a preview"; p=d.get("plan") or {}; assert p.get("rows"), "plan has no rows"; assert p.get("loadEstimates") is not None, "plan has no load estimates"' <<< "$body"

      # The app's main screen. The deploy token acts as its own empty, disabled
      # account (SMOKE_USER_EMAIL, src/tenancy.js smokeUser), never the owner's, so
      # no real health data can reach these public logs (security audit 2026-11,
      # SEC-010). Still only the status, the time and the server's short message.
      # A failure stops the release; a slow answer only warns, since the live
      # server's time varies (a cold start, Intervals).
      - name: Smoke test Today
        if: env.TARGET == 'production'
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          result="$(curl -sS -o "$RUNNER_TEMP/today.json" -w '%{http_code} %{time_total}' -H "Authorization: Bearer $OIDC_TOKEN" "https://aurin.health/app/api/today")"
          code="${result%% *}"
          seconds="${result##* }"
          echo "HTTP $code in ${seconds} s"
          if [ "$code" != "200" ]; then
            python -c 'import json,sys; print(str((json.load(open(sys.argv[1])) or {}).get("message",""))[:300])' "$RUNNER_TEMP/today.json" || true
            exit 1
          fi
          python -c 'import json,sys; d=json.load(open(sys.argv[1])); assert d.get("status")=="ok","status="+str(d.get("status")); assert d.get("date"),"no date"; assert isinstance(d.get("readiness"),dict),"no readiness"' "$RUNNER_TEMP/today.json"
          rm -f "$RUNNER_TEMP/today.json"
          if python -c 'import sys; sys.exit(0 if float(sys.argv[1]) > 6 else 1)' "$seconds"; then
            echo "::warning::Today took ${seconds} s (over 6 s)"
          fi

      - name: Smoke test shared food catalogue
        if: env.TARGET == 'production'
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/smoke-food-catalog.mjs

      - name: Smoke test the server
        if: env.TARGET == 'production'
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The old web app is gone: /app leads to the overview page.
          old_app="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://aurin.health/app")"
          [ "$old_app" = "301 https://aurin.health/" ] || { echo "/app must redirect to the overview page, got $old_app"; exit 1; }
          anonymous="$(curl -sS -o /dev/null -w '%{http_code}' "https://aurin.health/app/api/daily")"
          [ "$anonymous" = "401" ] || { echo "Dashboard API must reject anonymous requests, got HTTP $anonymous"; exit 1; }
          # Sessions are signed with SESSION_SECRET only: without it nobody can sign in.
          # Google sign-in stays open only for the iPhone app (?app=<challenge>).
          login="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://aurin.health/auth/google?app=$(printf 'a%.0s' $(seq 1 43))")"
          case "$login" in "302 https://accounts.google.com/"*) ;; *) echo "Google sign-in is not set up (HTTP ${login%% *}); is SESSION_SECRET set?"; exit 1;; esac
          home="$(curl -fsS "https://aurin.health/")"
          python -c 'import sys; s=sys.stdin.read(); assert "Aurin" in s; assert "href=\"/privacy\"" in s' <<< "$home"
          share_type="$(curl -fsS -o /dev/null -w '%{content_type}' "https://aurin.health/site/og-en.jpg")"
          [ "$share_type" = "image/jpeg" ] || { echo "Overview share image not served, got $share_type"; exit 1; }
          daily="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://aurin.health/app/api/daily")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"' <<< "$daily"
          sleep="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://aurin.health/app/api/sleep")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert "sessions" in d' <<< "$sleep"
          gym="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://aurin.health/app/api/gym")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert "values" in d; assert "videoLinks" in d' <<< "$gym"
          activities="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://aurin.health/app/api/activities")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert "activities" in d' <<< "$activities"
          week="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://aurin.health/app/api/week?start=$(TZ=Europe/Prague date -d 'monday this week' +%F)")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert len(d.get("days",[]))==7,"days="+str(len(d.get("days",[])))' <<< "$week"

      # The test server has no data of its own until a tester signs in, so it
      # gets the checks that need no account.
      - name: Smoke test the test server
        if: env.TARGET == 'staging'
        env:
          SHA: ${{ needs.test.outputs.sha }}
        shell: bash
        run: |
          set -euo pipefail
          anonymous="$(curl -sS -o /dev/null -w '%{http_code}' "https://$HOST/app/api/daily")"
          [ "$anonymous" = "401" ] || { echo "API must reject anonymous requests, got HTTP $anonymous"; exit 1; }
          home="$(curl -fsS -D "$RUNNER_TEMP/home-headers" "https://$HOST/")"
          grep -q "TEST · staging" <<< "$home" || { echo "The test server's badge is missing"; exit 1; }
          grep -qiE '^x-robots-tag: noindex' "$RUNNER_TEMP/home-headers" || { echo "The test server must stay out of search engines"; exit 1; }
          echo "Test server: https://$HOST (${SHA::7})" >> "$GITHUB_STEP_SUMMARY"
