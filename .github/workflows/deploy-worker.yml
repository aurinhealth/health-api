name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "migrations/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  # A red test suite never reaches production (or the D1 migrations).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      # The tenancy tests use node:sqlite, available from Node 22.
      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Check syntax
        run: npm run check

      - name: Lint (undefined variables)
        run: npm run lint:install && npm run lint

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply health-data --remote

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .

      # The first requests after a deploy may finish a database upgrade in
      # chunks; the API answers 503 until it is done.
      - name: Wait for the database upgrade
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            # Anonymous /app/api/me answers 401 only once the new version is
            # live and the upgrade is done (503 while upgrading; the previous
            # version may still answer for a few seconds after the deploy).
            code="$(curl -sS -o /dev/null -w '%{http_code}' "https://petrfitnessdata.eu/app/api/me" || true)"
            if [ "$code" = "401" ]; then echo "API ready"; exit 0; fi
            echo "Waiting for the new version and database upgrade (HTTP $code, attempt $attempt)"; sleep 10
          done
          echo "Database upgrade did not finish in time"; exit 1

      # Live Worker events during the smoke tests, so a platform error (for
      # example 1102, resource limits) shows its outcome and exceptions.
      - name: Start Worker tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          nohup npx --yes wrangler@4 tail health-api --format json > "$RUNNER_TEMP/tail.jsonl" 2> "$RUNNER_TEMP/tail.err" &
          sleep 15

      - name: Request GitHub OIDC token for strength smoke test
        id: oidc_strength
        shell: bash
        run: |
          set -euo pipefail
          response=""
          for attempt in 1 2 3; do
            if response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"; then
              break
            fi
            sleep $((attempt * 5))
          done
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Live strength generation smoke test
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          date_value="$(TZ=Europe/Prague date +%F)"
          # Keep the response body on failure so the cause is visible in the log.
          response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data "{\"action\":\"generate\",\"date\":\"$date_value\",\"preview\":true}" "https://petrfitnessdata.eu/automation/strength")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ]; then
            echo "HTTP $code"
            printf '%s\n' "$body" | head -c 4000
            sleep 5
            # Outcome, timing, exceptions and logs only; headers are not printed.
            python - "$RUNNER_TEMP/tail.jsonl" <<'PY' || true
          import json, sys, re
          text = open(sys.argv[1], encoding="utf-8", errors="ignore").read()
          dec = json.JSONDecoder(); i = 0; events = []
          while True:
              m = re.compile(r"\{").search(text, i)
              if not m: break
              try:
                  obj, end = dec.raw_decode(text, m.start()); events.append(obj); i = end
              except ValueError:
                  i = m.start() + 1
          for e in events:
              req = (e.get("event") or {}).get("request") or {}
              print(json.dumps({"url": str(req.get("url", "")).split("?")[0], "outcome": e.get("outcome"), "cpuTime": e.get("cpuTime"), "wallTime": e.get("wallTime"), "exceptions": e.get("exceptions"), "logs": [l.get("message") for l in e.get("logs") or []][-20:]}, ensure_ascii=False)[:3000])
          PY
            head -c 2000 "$RUNNER_TEMP/tail.err" || true
            exit 1
          fi
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; assert d.get("preview") is True, d; p=d.get("plan") or {}; assert p.get("rows"), p; assert p.get("loadEstimates") is not None, p' <<< "$body"

      - name: Smoke test food resolution
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body='{"name":"Milbona High Protein Pudding","brand":"Milbona","calories_100g":81,"protein_100g":10,"carbs_100g":6.4,"fat_100g":1.6,"fiber_100g":0.7,"salt_100g":0.28}'
          resolved="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" -X POST -H "Content-Type: application/json" --data "$body" "https://petrfitnessdata.eu/food/resolve")"
          python -c 'import json,sys; d=json.load(sys.stdin); p=d.get("product") or {}; assert d.get("status")=="ok",d; assert d.get("match")=="package_label",d; assert p.get("calories_100g")==81,p; assert p.get("protein_100g")==10,p; assert p.get("fiber_100g")==0.7,p; assert p.get("salt_100g")==0.28,p' <<< "$resolved"
          product="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/food/product?barcode=4056489918325")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d; assert d.get("product") or d.get("products"),d' <<< "$product"

      - name: Smoke test daily plan
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          plan="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/daily/plan")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d; assert "training" in d and "nutrition" in d and "food" in d and "meals" in d' <<< "$plan"

      - name: Smoke test Google Health nutrition
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/health/nutrition")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d; assert d.get("data_type")=="nutrition-log",d' <<< "$body"

      - name: Smoke test dashboard
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          page="$(curl -fsS "https://petrfitnessdata.eu/app")"
          anonymous="$(curl -sS -o /dev/null -w '%{http_code}' "https://petrfitnessdata.eu/app/api/daily")"
          [ "$anonymous" = "401" ] || { echo "Dashboard API must reject anonymous requests, got HTTP $anonymous"; exit 1; }
          python -c 'import sys; s=sys.stdin.read(); assert "Petr Fitness Data" in s; assert "Gym" in s; assert "Recovery & Health" in s; assert "sessionStorage" not in s; assert "Dashboard access key" not in s' <<< "$page"
          curl -fsS "https://petrfitnessdata.eu/app/dashboard-client.js?deployment=$GITHUB_SHA" -o /tmp/dashboard-client.js
          node --check /tmp/dashboard-client.js
          daily="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/daily")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"' <<< "$daily"
          sleep="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/sleep")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert "sessions" in d' <<< "$sleep"
          gym="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/gym")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert "values" in d; assert "videoLinks" in d' <<< "$gym"
          activities="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/activities")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert "activities" in d' <<< "$activities"
          week="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/week?start=$(TZ=Europe/Prague date -d 'monday this week' +%F)")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert len(d.get("days",[]))==7,d' <<< "$week"

      - name: Smoke test MCP endpoint
        shell: bash
        run: |
          set -euo pipefail
          init="$(curl -fsS -X POST -H "Authorization: Bearer health-strength-demo-2026" -H "Content-Type: application/json" -H "MCP-Protocol-Version: 2026-07-28" --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{}}}' "https://petrfitnessdata.eu/mcp")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["result"]["protocolVersion"]=="2026-07-28"; assert d["result"]["serverInfo"]["name"]=="health-api-strength-coach"' <<< "$init"
          discover="$(curl -fsS -X POST -H "Authorization: Bearer health-strength-demo-2026" -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -H "MCP-Protocol-Version: 2026-07-28" -H "Mcp-Method: server/discover" --data '{"jsonrpc":"2.0","id":3,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci-smoke-test","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' "https://petrfitnessdata.eu/mcp")"
          python -c 'import json,sys; d=json.load(sys.stdin); r=d["result"]; assert r["resultType"]=="complete"; assert "2026-07-28" in r["supportedVersions"]; assert r["_meta"]["io.modelcontextprotocol/serverInfo"]["name"]=="health-api-strength-coach"' <<< "$discover"
          tools="$(curl -fsS -X POST -H "Authorization: Bearer health-strength-demo-2026" -H "Content-Type: application/json" -H "MCP-Protocol-Version: 2026-07-28" --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "https://petrfitnessdata.eu/mcp")"
          python -c 'import json,sys; d=json.load(sys.stdin); names={x["name"] for x in d["result"]["tools"]}; assert "generateStrengthPlan" in names and "syncStrengthSheet" in names and "resolveFood" in names and "consumePlannedFood" in names and "updateFoodEntry" in names and "cancelFoodEntry" in names' <<< "$tools"
