name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "public/**"
      - "wrangler.jsonc"
      - "migrations/**"
      - "staging/**"
      - "food-migrations/**"
      - "scripts/*food-catalog*.mjs"
      - "scripts/provision-user-shards.mjs"
      - "scripts/verify-user-shards.mjs"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read
  deployments: write
  id-token: write

concurrency:
  group: production-deploy
  cancel-in-progress: false

jobs:
  # A red test suite never reaches production (or the D1 migrations).
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out the private AI prompts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: shaarkyn/aurin-prompts
          token: ${{ secrets.PROMPTS_REPO_TOKEN }}
          path: src/private

      # The tenancy tests use node:sqlite, available from Node 22.
      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      - name: Check syntax
        run: npm run check

      - name: Lint (undefined variables)
        run: npm run lint:install && npm run lint

      - name: Run tests
        run: npm test

  deploy:
    needs: test
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Check out the private AI prompts
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: shaarkyn/aurin-prompts
          token: ${{ secrets.PROMPTS_REPO_TOKEN }}
          path: src/private

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: "22"

      # Sign-ins are signed with SESSION_SECRET only (src/dashboard-auth.js).
      # Without it nobody could sign in, so nothing is deployed.
      - name: Check Worker secrets
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          npx --yes wrangler@4 secret list | node scripts/require-secrets.mjs SESSION_SECRET

      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply health-data --remote

      - name: Prepare isolated user data databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-user-shards.mjs

      - name: Prepare independent food catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-food-catalog.mjs

      # A secret saved in the Cloudflare dashboard marks the Worker as last
      # deployed from the dashboard. Wrangler then downloads the dashboard
      # config before every deploy, and that call times out for this Worker.
      # Saving a harmless secret through Wrangler first clears the mark.
      - name: Clear the dashboard deploy mark
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          set -euo pipefail
          printf 'wrangler' | npx --yes wrangler@4 secret put DEPLOY_SOURCE --name health-api

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@953926a2e2182532811c01a25e53647d93bf07c0 # v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy --config wrangler.runtime.jsonc
          workingDirectory: .

      # The first requests after a deploy may finish a database upgrade in
      # chunks; the API answers 503 until it is done.
      - name: Wait for the database upgrade
        shell: bash
        run: |
          set -euo pipefail
          for attempt in $(seq 1 60); do
            # Anonymous /app/api/me answers 401 only once the new version is
            # live and the upgrade is done (503 while upgrading; the previous
            # version may still answer for a few seconds after the deploy).
            code="$(curl -sS -D "$RUNNER_TEMP/routing-headers" -o /dev/null -w '%{http_code}' "https://petrfitnessdata.eu/app/api/me" || true)"
            if [ "$code" = "401" ] && grep -qiE '^x-storage-routing: 1' "$RUNNER_TEMP/routing-headers" && grep -qiE '^x-food-catalog-routing: 1' "$RUNNER_TEMP/routing-headers"; then echo "API ready"; exit 0; fi
            echo "Waiting for the new version and database upgrade (HTTP $code, attempt $attempt)"; sleep 10
          done
          echo "Database upgrade did not finish in time"; exit 1

      - name: Verify independent user databases
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/verify-user-shards.mjs

      - name: Activate user data routing
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-user-shards.mjs --activate

      - name: Migrate and verify food catalogue
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/provision-food-catalog.mjs --migrate

      # Live Worker events during the smoke tests, so a platform error (for
      # example 1102, resource limits) shows its outcome and exceptions.
      - name: Start Worker tail
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        shell: bash
        run: |
          nohup npx --yes wrangler@4 tail health-api --format json > "$RUNNER_TEMP/tail.jsonl" 2> "$RUNNER_TEMP/tail.err" &
          sleep 15

      - name: Request GitHub OIDC token for strength smoke test
        id: oidc_strength
        shell: bash
        run: |
          set -euo pipefail
          response=""
          for attempt in 1 2 3; do
            if response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"; then
              break
            fi
            sleep $((attempt * 5))
          done
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Live strength generation smoke test
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          date_value="$(TZ=Europe/Prague date +%F)"
          # Keep the response body on failure so the cause is visible in the log.
          response="$(curl -sS -w '\n%{http_code}' -X POST -H "Authorization: Bearer $OIDC_TOKEN" -H "Content-Type: application/json" --data "{\"action\":\"generate\",\"date\":\"$date_value\",\"preview\":true}" "https://petrfitnessdata.eu/automation/strength")"
          code="${response##*$'\n'}"
          body="${response%$'\n'*}"
          if [ "$code" != "200" ]; then
            # The repository and its Actions logs are public: a summary of the
            # response and the Worker's outcome and exceptions, never the plan
            # itself, the request headers or the Worker's own log lines.
            echo "HTTP $code"
            node scripts/ci-summary.mjs <<< "$body"
            sleep 5
            python - "$RUNNER_TEMP/tail.jsonl" <<'PY' || true
          import json, sys, re
          text = open(sys.argv[1], encoding="utf-8", errors="ignore").read()
          dec = json.JSONDecoder(); i = 0; events = []
          while True:
              m = re.compile(r"\{").search(text, i)
              if not m: break
              try:
                  obj, end = dec.raw_decode(text, m.start()); events.append(obj); i = end
              except ValueError:
                  i = m.start() + 1
          for e in events:
              req = (e.get("event") or {}).get("request") or {}
              print(json.dumps({"url": str(req.get("url", "")).split("?")[0], "outcome": e.get("outcome"), "cpuTime": e.get("cpuTime"), "wallTime": e.get("wallTime"), "exceptions": [str(x.get("name", "")) + ": " + str(x.get("message", ""))[:300] for x in e.get("exceptions") or []]}, ensure_ascii=False)[:3000])
          PY
            head -c 2000 "$RUNNER_TEMP/tail.err" || true
            exit 1
          fi
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", "status="+str(d.get("status")); assert d.get("preview") is True, "not a preview"; p=d.get("plan") or {}; assert p.get("rows"), "plan has no rows"; assert p.get("loadEstimates") is not None, "plan has no load estimates"' <<< "$body"

      - name: Smoke test Google Health nutrition
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          body="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/health/nutrition")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok","status="+str(d.get("status")); assert d.get("data_type")=="nutrition-log","data_type="+str(d.get("data_type"))' <<< "$body"

      - name: Smoke test shared food catalogue
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: node scripts/smoke-food-catalog.mjs

      - name: Smoke test the server
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          # The old web app is gone: /app leads to the overview page.
          old_app="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://petrfitnessdata.eu/app")"
          [ "$old_app" = "301 https://petrfitnessdata.eu/" ] || { echo "/app must redirect to the overview page, got $old_app"; exit 1; }
          anonymous="$(curl -sS -o /dev/null -w '%{http_code}' "https://petrfitnessdata.eu/app/api/daily")"
          [ "$anonymous" = "401" ] || { echo "Dashboard API must reject anonymous requests, got HTTP $anonymous"; exit 1; }
          # Sessions are signed with SESSION_SECRET only: without it nobody can sign in.
          # Google sign-in stays open only for the iPhone app (?app=<challenge>).
          login="$(curl -sS -o /dev/null -w '%{http_code} %{redirect_url}' "https://petrfitnessdata.eu/auth/google?app=$(printf 'a%.0s' $(seq 1 43))")"
          case "$login" in "302 https://accounts.google.com/"*) ;; *) echo "Google sign-in is not set up (HTTP ${login%% *}); is SESSION_SECRET set?"; exit 1;; esac
          home="$(curl -fsS "https://petrfitnessdata.eu/")"
          python -c 'import sys; s=sys.stdin.read(); assert "Aurin" in s; assert "Google Health data disclosure" in s; assert "href=\"/privacy\"" in s' <<< "$home"
          share_type="$(curl -fsS -o /dev/null -w '%{content_type}' "https://petrfitnessdata.eu/site/og-en.png")"
          [ "$share_type" = "image/png" ] || { echo "Overview share image not served, got $share_type"; exit 1; }
          daily="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/daily")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"' <<< "$daily"
          sleep="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/sleep")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert "sessions" in d' <<< "$sleep"
          gym="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/gym")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert "values" in d; assert "videoLinks" in d' <<< "$gym"
          activities="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/activities")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert "activities" in d' <<< "$activities"
          week="$(curl -fsS -H "Authorization: Bearer $OIDC_TOKEN" "https://petrfitnessdata.eu/app/api/week?start=$(TZ=Europe/Prague date -d 'monday this week' +%F)")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok"; assert len(d.get("days",[]))==7,"days="+str(len(d.get("days",[])))' <<< "$week"
