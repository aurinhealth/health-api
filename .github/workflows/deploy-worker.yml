name: Deploy Cloudflare Worker

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - "src/**"
      - "wrangler.jsonc"
      - "migrations/**"
      - ".github/workflows/deploy-worker.yml"

permissions:
  contents: read
  deployments: write
  id-token: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Deploy Worker
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: deploy
          workingDirectory: .
      - name: Apply D1 migrations
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: d1 migrations apply health-data --remote

      - name: Request GitHub OIDC token for strength smoke test
        id: oidc_strength
        shell: bash
        run: |
          set -euo pipefail
          response=""
          for attempt in 1 2 3; do
            if response="$(curl -fsSL -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=health-strength")"; then
              break
            fi
            sleep $((attempt * 5))
          done
          token="$(python -c 'import json,sys; print(json.load(sys.stdin)["value"])' <<< "$response")"
          echo "::add-mask::$token"
          echo "token=$token" >> "$GITHUB_OUTPUT"

      - name: Live strength generation smoke test
        env:
          OIDC_TOKEN: ${{ steps.oidc_strength.outputs.token }}
        shell: bash
        run: |
          set -euo pipefail
          date_value="$(TZ=Europe/Prague date +%F)"
          body="$(curl -fsS -X POST             -H "Authorization: Bearer $OIDC_TOKEN"             -H "Content-Type: application/json"             --data "{\"action\":\"generate\",\"date\":\"$date_value\",\"preview\":true}"             "https://petrfitnessdata.eu/automation/strength")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status") == "ok", d; assert d.get("preview") is True, d; p=d.get("plan") or {}; assert p.get("rows"), p; assert p.get("loadEstimates") is not None, p' <<< "$body"

      - name: Smoke test food resolution
        shell: bash
        run: |
          set -euo pipefail
          body='{"name":"Milbona High Protein Pudding","brand":"Milbona","calories_100g":81,"protein_100g":10,"carbs_100g":6.4,"fat_100g":1.6,"fiber_100g":0.7,"salt_100g":0.28}'
          resolved="$(curl -fsS -X POST -H "Content-Type: application/json" --data "$body" "https://petrfitnessdata.eu/food/resolve")"
          python -c 'import json,sys; d=json.load(sys.stdin); p=d.get("product") or {}; assert d.get("status")=="ok",d; assert d.get("match")=="package_label",d; assert p.get("calories_100g")==81,p; assert p.get("protein_100g")==10,p; assert p.get("fiber_100g")==0.7,p; assert p.get("salt_100g")==0.28,p' <<< "$resolved"
          product="$(curl -fsS "https://petrfitnessdata.eu/food/product?barcode=4056489918325")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d; assert d.get("product") or d.get("products"),d' <<< "$product"

      - name: Smoke test daily plan
        shell: bash
        run: |
          set -euo pipefail
          plan="$(curl -fsS "https://petrfitnessdata.eu/daily/plan")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d; assert "training" in d and "nutrition" in d and "food" in d and "meals" in d' <<< "$plan"

      - name: Smoke test dashboard session
        env:
          DASHBOARD_KEY: ${{ secrets.STRENGTH_API_KEY }}
        shell: bash
        run: |
          set -euo pipefail
          test -n "$DASHBOARD_KEY"
          page="$(curl -fsS "https://petrfitnessdata.eu/app")"
          python -c 'import sys; s=sys.stdin.read(); assert "Petr Fitness Data" in s; assert "/app/login" in s; assert "sessionStorage" not in s' <<< "$page"
          headers="$(mktemp)"
          curl -fsS -D "$headers" -o /tmp/dashboard-login.json -X POST -H "Content-Type: application/json" --data "{"key":"$DASHBOARD_KEY"}" "https://petrfitnessdata.eu/app/login"
          python -c 'import json,sys; d=json.load(open("/tmp/dashboard-login.json")); assert d.get("status")=="ok",d' 
          cookie="$(awk 'BEGIN{IGNORECASE=1} /^set-cookie:/ {print $2}' "$headers" | tr -d '\r' | cut -d";" -f1)"
          test -n "$cookie"
          api="$(curl -fsS -H "Cookie: $cookie" "https://petrfitnessdata.eu/app/api/daily")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d.get("status")=="ok",d' <<< "$api"
          unauth="$(curl -sS -o /dev/null -w "%{http_code}" "https://petrfitnessdata.eu/app/api/daily")"
          test "$unauth" = "401"
          rm -f "$headers" /tmp/dashboard-login.json

      - name: Smoke test MCP endpoint
        shell: bash
        run: |
          set -euo pipefail
          init="$(curl -fsS -X POST -H "Authorization: Bearer health-strength-demo-2026" -H "Content-Type: application/json" -H "MCP-Protocol-Version: 2026-07-28" --data '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":"2026-07-28","capabilities":{}}}' "https://petrfitnessdata.eu/mcp")"
          python -c 'import json,sys; d=json.load(sys.stdin); assert d["result"]["protocolVersion"]=="2026-07-28"; assert d["result"]["serverInfo"]["name"]=="health-api-strength-coach"' <<< "$init"
          discover="$(curl -fsS -X POST -H "Authorization: Bearer health-strength-demo-2026" -H "Content-Type: application/json" -H "Accept: application/json, text/event-stream" -H "MCP-Protocol-Version: 2026-07-28" -H "Mcp-Method: server/discover" --data '{"jsonrpc":"2.0","id":3,"method":"server/discover","params":{"_meta":{"io.modelcontextprotocol/protocolVersion":"2026-07-28","io.modelcontextprotocol/clientInfo":{"name":"ci-smoke-test","version":"1.0.0"},"io.modelcontextprotocol/clientCapabilities":{}}}}' "https://petrfitnessdata.eu/mcp")"
          python -c 'import json,sys; d=json.load(sys.stdin); r=d["result"]; assert r["resultType"]=="complete"; assert "2026-07-28" in r["supportedVersions"]; assert r["_meta"]["io.modelcontextprotocol/serverInfo"]["name"]=="health-api-strength-coach"' <<< "$discover"
          tools="$(curl -fsS -X POST -H "Authorization: Bearer health-strength-demo-2026" -H "Content-Type: application/json" -H "MCP-Protocol-Version: 2026-07-28" --data '{"jsonrpc":"2.0","id":2,"method":"tools/list","params":{}}' "https://petrfitnessdata.eu/mcp")"
          python -c 'import json,sys; d=json.load(sys.stdin); names={x["name"] for x in d["result"]["tools"]}; assert "generateStrengthPlan" in names and "syncStrengthSheet" in names and "resolveFood" in names and "consumePlannedFood" in names and "updateFoodEntry" in names and "cancelFoodEntry" in names' <<< "$tools"