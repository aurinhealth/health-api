name: Website copy

# A reminder, never a failure: an app change that does not touch the website
# gets a warning, so the overview on petrfitnessdata.eu keeps describing what
# the app does (see "The website follows the app" in CLAUDE.md).
on:
  pull_request:
    branches:
      - main
    paths:
      - "ios-native/Loadwise/**"
      - "ios-native/Shared/**"

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Check whether the overview changed with the app
        env:
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if git diff --name-only "$BASE...$HEAD" | grep -qx 'src/site-pages.js'; then
            echo "The overview changed together with the app." >> "$GITHUB_STEP_SUMMARY"
          else
            msg="This pull request changes the app but not the website. If users will see the change, update overviewPage in src/site-pages.js."
            echo "::warning title=Website copy::$msg"
            echo "$msg" >> "$GITHUB_STEP_SUMMARY"
          fi
